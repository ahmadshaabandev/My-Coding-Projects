openapi: 3.1.0
info:
  title: Link To Card API
  version: "1.0.0"
  summary: Social-card images from HTML and CSS templates.
  description: |
    Renders Open Graph / social-card images from HTML and CSS templates.

    Two ways to get an image:
    - a signed URL (GET /v1/og/...) that you put in <meta property="og:image">;
    - POST /v1/images with an API key.

    One image is one rendered size. Cache hits and failed renders are never counted.

    GET /v1/inspect checks one page's link-preview tags and its og:image, like the
    free checker at https://linktocard.com/tools/og-checker. It never counts as an image.
    Human documentation: https://linktocard.com/docs/api
servers:
  - url: https://linktocard.com
tags:
  - name: Images
  - name: Account
  - name: Tools
  # feature:pdf
  - name: PDF
    description: |
      PDF documents from HTML templates: POST /v1/pdf, signed PDF links and stored PDFs.
      Rendered by Cloudflare Browser Run with JavaScript off and no network access. Card
      images are still rendered without a browser. Human documentation:
      https://linktocard.com/docs/pdf

  # /feature:pdf
  # feature:batch
  - name: Bulk documents
    description: |
      One PDF for every row of your data (POST /v1/batches), made in the background through a queue
      and counted like POST /v1/pdf, with a zip download and optional certificate verification
      records (GET /v/{id}). Human documentation: https://linktocard.com/docs/bulk
  # /feature:batch
  # feature:toolkit
  - name: PDF toolkit
    description: |
      Operations on existing PDFs without a browser: merge, split, stamp, fill, fields, from-images
      and protect. The body is JSON, or multipart/form-data with the files as uploads. Every
      request that succeeds counts (results are not served again from storage); fields counts
      nothing. Human documentation: https://linktocard.com/docs/pdf-tools
  # /feature:toolkit
  # feature:linkcards
  - name: Link cards
    description: |
      Cards made from a page's own metadata: POST /v1/cards/from-url and signed /v1/link/... URLs.
      Human documentation: https://linktocard.com/docs/link-cards
  # /feature:linkcards
  # feature:charts
  - name: Charts
    description: |
      Chart images: a chart described as JSON, drawn as a PNG, JPEG or WebP image, through a signed
      /v1/chart/... URL or POST /v1/charts. A chart counts one image the first time it is drawn;
      repeat views are free. Human documentation: https://linktocard.com/docs/charts
  # /feature:charts
paths:
  /v1/images:
    post:
      tags: [Images]
      operationId: createImage
      summary: Render one card, or return it from cache.
      description: |
        Renders the card and stores it for the plan's cache period, or returns the stored
        image when the same card (account, template, data, size, format) was rendered before.
        A cached response is not counted against the monthly allowance.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRequest"
            examples:
              starter:
                summary: A starter template
                value:
                  template: blog
                  data:
                    title: How we cut our build time in half
                    author: Maya Chen
              inline:
                summary: Inline HTML and CSS
                value:
                  html: '<div class="card"><h1>{{title}}</h1></div>'
                  css: ".card { display: flex; width: 100%; height: 100%; padding: 80px } h1 { font-size: 80px }"
                  data:
                    title: Hello from my own template
                  format: jpeg
      responses:
        "200":
          description: |
            The image. JSON by default; the image bytes when the request has "response": "binary".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-LTC-Cache:
              description: Binary responses only. miss when this request rendered (and counted) the image, hit when it was served from cache; in JSON responses see "cached".
              schema:
                type: string
                enum: [hit, miss]
            X-LTC-Image-Url:
              description: Binary responses only. The public URL of the stored image.
              schema:
                type: string
                format: uri
            X-LTC-Warnings:
              description: Binary responses only. The render warnings as a URI-encoded JSON array of strings.
              schema:
                type: string
            ETag:
              description: Binary responses only. The image id in double quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  /v1/usage:
    get:
      tags: [Account]
      operationId: getUsage
      summary: The allowance for the current period.
      security:
        - apiKey: []
      responses:
        "200":
          description: Usage for the current period.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/templates:
    get:
      tags: [Account]
      operationId: listTemplates
      summary: The starter templates and the account's own templates.
      security:
        - apiKey: []
      responses:
        "200":
          description: Templates that can be used as "template".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/inspect:
    get:
      tags: [Tools]
      operationId: inspectPage
      summary: Check one page's Open Graph and Twitter tags and its og:image.
      description: |
        Fetches the one page given in `url` as "LinkToCardBot/1.0 (+https://linktocard.com/bot)":
        https only, at most 3 redirects (each address checked), 5 seconds and 2 MB for the page.
        Measures the og:image (or twitter:image) with a HEAD then a GET, and reads robots.txt
        once (a block is a warning only). Never runs JavaScript, never crawls, never returns
        the page's HTML.

        A result is stored for 10 minutes; the same url within that time returns it with
        cached: true and is not counted. Uncached checks count against a daily allowance per
        API key (UTC day): Free 100, Starter 1000, Pro 5000. Counts no images.
      security:
        - apiKey: []
      parameters:
        - name: url
          in: query
          required: true
          description: Absolute https:// URL of the page, default port, no username or password. A fragment is dropped.
          schema:
            type: string
            format: uri
            maxLength: 2048
          example: https://example.com/blog/launch-week
      responses:
        "200":
          description: The check result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          description: forbidden (the address or a redirect target is not on the public internet) or account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/PageFetchFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/og/{site_id}/{template}.{ext}:
    get:
      tags: [Images]
      operationId: getSignedCard
      summary: A signed card URL, for og:image.
      description: |
        Public. Authenticated by the "sig" query parameter: the lowercase hexadecimal
        HMAC-SHA256, keyed with the site secret, of these lines joined with "\n":

          1. the path, e.g. /v1/og/s_4k2j9x0q1m7c8d5e/blog.png
          2. the parameter names (without "sig"), sorted, joined with ","
          3. one "name=value" line per parameter in that order, with decoded values

        Every other query parameter is template data. Names match ^[a-z][a-z0-9_]{0,31}$,
        each may appear once, at most 24 of them (plus "size"), values at most 1000 characters
        and without control characters. Path and query together are at most 4096 characters.

        The first request renders, stores and counts the image; later requests are served
        from cache and are not counted. HEAD never renders and never counts.
      security: []
      parameters:
        - name: site_id
          in: path
          required: true
          description: Site id from the dashboard.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: s_4k2j9x0q1m7c8d5e
        - name: template
          in: path
          required: true
          description: A starter template id (blog, dark, quote, launch, docs) or the id of a template owned by the site's account.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: blog
        - name: ext
          in: path
          required: true
          description: File extension; chooses the output format. jpg and jpeg both give JPEG.
          schema:
            type: string
            enum: [png, jpg, jpeg, webp]
        - name: sig
          in: query
          required: true
          description: The signature, 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: size
          in: query
          required: false
          description: Output size. Signed like any other parameter.
          schema:
            $ref: "#/components/schemas/Size"
        # feature:email
        - name: open
          in: query
          required: false
          description: |
            Email images (https://linktocard.com/docs/email-images): a signed, comma-separated list
            of at most 3 template fields whose values are not signed, so that an email platform can
            fill them in for each reader. The open fields are left out of the signed message and
            appended after sig. Each unique email image (the template, for your own templates its
            version, the signed parameters, the normalized open values, size, format and watermark,
            on the site's account) is counted once: its first render counts 1 image and is stored,
            later opens are served from cache at no cost while it is stored, and once the stored
            copy has expired it is rendered again without being counted again, for 400 days from
            that count, also when the allowance is used up. Responses to URLs with open fields carry
            X-LTC-Cache (hit or miss) and X-LTC-Credits-Used: 1 for the request that was counted, 0
            otherwise (a free render after expiry says miss and 0).
          schema:
            type: string
          example: name
        # /feature:email
        - name: data
          in: query
          required: false
          description: Template data, one query parameter per key (for example title=Hello&author=Zo%C3%AB).
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              maxLength: 1000
            example:
              title: Hello world
              author: Zoë Müller
        - name: If-None-Match
          in: header
          required: false
          description: An ETag from an earlier response; a match answers 304.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ImageFile"
        "304":
          description: Not modified (If-None-Match matched).
        "400":
          description: |
            unsupported_size, or invalid_request with details.reason size_not_supported: a
            starter template (blog, dark, quote, launch, docs) signed with size=email. Answered
            after the signature is verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          description: |
            invalid_signature (details.reason is one of missing_sig, malformed_sig, bad_param_name,
            duplicate_param, bad_value, too_many_params, url_too_long, signature_mismatch),
            or account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  # feature:pdf
  /v1/pdf:
    post:
      tags: [PDF]
      operationId: createPdf
      summary: Render one PDF document, or return it from storage.
      description: |
        Renders an HTML template (a PDF starter template, one of your own templates, or inline
        HTML and CSS) to a PDF and stores it for the plan's cache period. The same request again
        (account, template, data, page setup, header, footer, file name) returns the stored PDF
        and is not counted.

        PDFs are rendered by Cloudflare Browser Run with JavaScript turned off and no network
        access: remote images are downloaded first, through the same guarded fetcher as card
        images, and embedded in the document.

        A PDF of 1 to 10 pages counts as 2 images, plus 1 more for each further 10 pages
        started (11-20 pages: 3, 41-50 pages: 6). It is charged as one block: from the monthly
        allowance when it fits there, otherwise from one top-up with enough left, otherwise the
        answer is 402. A PDF may have at most 50 pages and at most 20 MB; a longer or larger one
        answers 422 and is not charged. On the Free plan every page carries the footer line
        "Made with Link To Card", and the header and footer are printed as plain text.

        Renders that reach the browser and fail because of the document (more than 50 pages, a
        PDF over 20 MB, a timeout, a document the browser cannot render, an unreadable page
        count), and PDFs that need more images than are left (402 after rendering), are capped
        at 20 per UTC day on Free and 200 on Starter and Pro, per account for this endpoint and
        per site for signed PDF links; past the cap the answer is 429 until 00:00 UTC. Failures
        of Browser Run itself never count. The signed links of all of an account's sites
        together are capped at 40 on Free and 400 on Starter and Pro as well. A render takes its
        place under a cap before it starts and gives it back when it ends with a PDF; while
        renders still running hold the last places, the answer is 429 with a Retry-After of a
        few seconds. A render cut off before it ends counts as a failure. Such a failure is remembered for 10 minutes: the
        identical request gets the same answer without being rendered or counted again (a
        remembered 402 is checked again against what is left now). Of identical requests sent
        at the same time only one renders; the others wait up to 90 seconds for its result.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfRequest"
            examples:
              starter:
                summary: The invoice starter template
                value:
                  template: invoice
                  data:
                    seller_name: Fernhill Studio
                    buyer_name: Okafor & Lund Architects
                    invoice_number: INV-2026-0142
                    issue_date: Nov 25, 2026
                    currency: USD
                    items:
                      - description: Brand strategy workshop
                        quantity: "2"
                        unit_price: "1,200.00"
                        amount: "2,400.00"
                    total: "2,400.00"
                  filename: invoice-INV-2026-0142.pdf
              inline:
                summary: Inline HTML and CSS with a page-numbered footer
                value:
                  html: "<h1>{{title}}</h1>{{#items}}<p>{{body}}</p>{{/items}}"
                  css: "h1 { font-family: 'Source Serif 4', serif }"
                  data:
                    title: Release notes
                    items:
                      - body: Faster exports.
                  pdf:
                    format: letter
                    margin: { top: 20mm, bottom: 20mm }
                    footer: '<div style="width:100%;font-size:9px;text-align:center">Page <span class="pageNumber"></span> of <span class="totalPages"></span></div>'
                  response: binary
      responses:
        "200":
          description: |
            JSON by default; the PDF itself when the request has "response": "binary".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Content-Disposition:
              description: Binary responses only. inline; filename="<the sanitised file name>".
              schema:
                type: string
            X-LTC-Pages:
              description: Binary responses only. Pages in the PDF.
              schema:
                type: integer
            X-LTC-Credits-Used:
              description: Binary responses only. Images this request charged; 0 when the PDF was already stored.
              schema:
                type: integer
            X-LTC-Cache:
              description: Binary responses only. miss when this request rendered (and counted) the PDF, hit when it was served from storage.
              schema:
                type: string
                enum: [hit, miss]
            X-LTC-Pdf-Url:
              description: Binary responses only. The public URL of the stored PDF.
              schema:
                type: string
                format: uri
            X-LTC-Warnings:
              description: Binary responses only. The render warnings as a URI-encoded JSON array of strings.
              schema:
                type: string
            ETag:
              description: Binary responses only. The PDF id in double quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdf"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "402":
          $ref: "#/components/responses/PdfQuotaExceeded"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PdfPayloadTooLarge"
        "422":
          $ref: "#/components/responses/PdfUnprocessable"
        "429":
          $ref: "#/components/responses/PdfRateLimited"
        "500":
          $ref: "#/components/responses/PdfServerError"
        "503":
          $ref: "#/components/responses/PdfNotConfigured"
        "504":
          $ref: "#/components/responses/PdfRenderTimeout"
  /v1/pdf/{site_id}/{template}.pdf:
    get:
      tags: [PDF]
      operationId: getSignedPdf
      summary: A signed PDF link.
      description: |
        Public. Signed exactly like a card URL: "sig" is the lowercase hexadecimal HMAC-SHA256,
        keyed with the site secret, of the path (e.g. /v1/pdf/s_4k2j9x0q1m7c8d5e/invoice.pdf),
        the sorted parameter names joined with ",", and one "name=value" line per parameter,
        joined with "\n". The signature is checked before anything is rendered.

        format, landscape, filename and items are reserved; every other parameter is template
        data. items is the list for {{#items}} sections, as a JSON-encoded array of flat objects.
        The parameter rules of card URLs apply: names match ^[a-z][a-z0-9_]{0,31}$, at most 24
        parameters, each value (items included) at most 1000 characters without control
        characters, path and query together at most 4096 characters. Longer documents need
        POST /v1/pdf.

        The first request renders, stores and counts the PDF; later requests are served from
        storage and are not counted. Failed renders of a site's signed links count toward a
        daily cap per site and one for all of the account's sites together (see POST /v1/pdf),
        whoever opens them; reaching the site's cap stops only that site's new signed PDFs.

        HEAD never renders and never counts. It answers what the GET would answer before
        rendering: 402 when not enough images are left, 429 when the site's daily cap on failed
        renders is reached or, for a Free account, the free brake is on, and the status of a
        remembered failure (for example 422).
      security: []
      parameters:
        - name: site_id
          in: path
          required: true
          description: Site id from the dashboard.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: s_4k2j9x0q1m7c8d5e
        - name: template
          in: path
          required: true
          description: A PDF starter template id or the id of a template owned by the site's account.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: invoice
        - name: sig
          in: query
          required: true
          description: The signature, 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: format
          in: query
          required: false
          description: Paper format. Signed like any other parameter.
          schema:
            $ref: "#/components/schemas/PdfFormat"
        - name: landscape
          in: query
          required: false
          description: true or false (1 or 0). Signed like any other parameter.
          schema:
            type: string
            enum: ["true", "false", "1", "0"]
        - name: filename
          in: query
          required: false
          description: Download name; sanitised, at most 120 characters, always ending in .pdf. Default "<template>.pdf".
          schema:
            type: string
        - name: items
          in: query
          required: false
          description: The list for {{#items}} sections, JSON-encoded.
          schema:
            type: string
          example: '[{"description":"Design","amount":"1,200.00"}]'
        - name: data
          in: query
          required: false
          description: Template data, one query parameter per key.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              maxLength: 1000
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PdfFile"
        "304":
          description: Not modified (If-None-Match matched).
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PdfQuotaExceeded"
        "403":
          description: invalid_signature (details.reason as for card URLs) or account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/PdfUnprocessable"
        "429":
          $ref: "#/components/responses/PdfRateLimited"
        "500":
          $ref: "#/components/responses/PdfServerError"
        "503":
          $ref: "#/components/responses/PdfNotConfigured"
        "504":
          $ref: "#/components/responses/PdfRenderTimeout"
  # /feature:pdf
  /i/{account_id}/{id}.{ext}:
    get:
      tags: [Images]
      operationId: getStoredImage
      summary: A stored image, as returned in "url" by POST /v1/images.
      description: Public. Serves the stored image until its cache period ends. Never renders.
      security: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          example: u_hkr8wty4jftnyum3
        - name: id
          in: path
          required: true
          description: The image id.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: ext
          in: path
          required: true
          schema:
            type: string
            enum: [png, jpg, jpeg, webp]
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ImageFile"
        "304":
          description: Not modified (If-None-Match matched).
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
  # feature:pdf
  /i/{account_id}/{id}.pdf:
    get:
      tags: [PDF]
      operationId: getStoredPdf
      summary: A stored PDF, as returned in "url" by POST /v1/pdf.
      description: Public. Serves the stored PDF until its cache period ends, with the file name it was rendered with. Never renders.
      security: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          example: u_hkr8wty4jftnyum3
        - name: id
          in: path
          required: true
          description: The PDF id.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PdfFile"
        "304":
          description: Not modified (If-None-Match matched).
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PdfNotConfigured"
  # /feature:pdf
  # feature:batch
  /v1/batches:
    post:
      tags: [Bulk documents]
      operationId: createBatch
      summary: Start a batch, one PDF per row.
      description: |
        Checks the whole request, then accepts it (202) and makes one PDF per row in the background.
        Each row is rendered and counted exactly like a POST /v1/pdf request with that row as data.

        Before a batch is accepted, the monthly allowance and top-ups together must have at least
        2 images for every row (the least a PDF counts), and the account may have at most 2
        batches queued or running. Rows per batch by plan: Free 25, Starter 500, Pro 2000. More
        rows than the plan takes answer 403 plan_required while a higher plan takes that many, and
        400 above every plan. An unknown template answers 404, like POST /v1/pdf.

        Without "filename", the documents are named "<template>-{{n}}.pdf" after a starter
        template (certificate-1.pdf, certificate-2.pdf, ...) and "document-{{n}}.pdf" after one of
        your own templates. Names are unique within a batch, ignoring case: a repeated name gets
        " (2)", " (3)" and so on.

        A document whose render fails because the renderer was busy or failed is tried again, at most
        3 times in all. When the images run out during the batch, the remaining rows fail with
        quota_exceeded and the batch ends as "partial".
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
            examples:
              certificates:
                summary: Certificates with verification records
                value:
                  template: certificate
                  rows:
                    - title: Certificate of Completion
                      recipient_name: Amara Nwosu
                      achievement: for completing the Advanced TypeScript workshop.
                      issuer_name: Lanternworks Training
                      date: November 25, 2026
                  filename: "certificate-{{recipient_name}}.pdf"
                  verify: true
      responses:
        "202":
          description: Accepted. The batch without rows, every row "queued"; zip_parts is empty.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "402":
          $ref: "#/components/responses/BatchQuotaExceeded"
        "403":
          $ref: "#/components/responses/BatchForbidden"
        "404":
          $ref: "#/components/responses/BatchTemplateNotFound"
        "409":
          $ref: "#/components/responses/BatchConflict"
        "413":
          $ref: "#/components/responses/BatchPayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
    get:
      tags: [Bulk documents]
      operationId: listBatches
      summary: The account's batches, newest first.
      description: |
        One page of batches, each as POST /v1/batches answers it but without zip_parts. When more
        follow, next_before is the id to send as "before" for the next page; on the last page it is
        null. A batch is listed until it has finished and the storage time of its last PDF has
        ended; the daily clean-up then deletes it (its certificate records stay).
      security:
        - apiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Batches per page, from 1 to 100 (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          required: false
          description: The next_before of the previous page, the id of one of your batches.
          schema:
            type: string
            pattern: "^bat_[a-z0-9]+$"
      responses:
        "200":
          description: One page of batches.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
  /v1/batches/{batch_id}:
    get:
      tags: [Bulk documents]
      operationId: getBatch
      summary: A batch's progress and its documents.
      security:
        - apiKey: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: The batch id that POST /v1/batches answered with.
          schema:
            type: string
            pattern: "^bat_[A-Za-z0-9]+$"
          example: bat_m4q8x2k7v1c9d3e6
      responses:
        "200":
          description: The batch, with one entry per row and its ZIP parts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
  /v1/batches/{batch_id}/zip:
    get:
      tags: [Bulk documents]
      operationId: getBatchZip
      summary: One part of the documents made so far, as a ZIP.
      description: |
        The documents that are made and still stored are packed into parts in row order, each part
        at most 500 files and 2 GB; the batch's zip_parts lists them, with the exact size of each.
        This streams one part: each PDF under its row's file name (unique across all parts), stored,
        not compressed again, with data descriptors. While a batch runs, or as its PDFs expire, the
        parts can change: read zip_parts again before downloading. A batch with no stored document
        has no part.
      security:
        - apiKey: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: The batch id that POST /v1/batches answered with.
          schema:
            type: string
            pattern: "^bat_[A-Za-z0-9]+$"
          example: bat_m4q8x2k7v1c9d3e6
        - name: part
          in: query
          required: false
          description: The part, from 1, as zip_parts lists it. Without it, part 1.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The ZIP of that part.
          headers:
            Content-Disposition:
              description: attachment; filename="<batch id>.zip", or "<batch id>-part-<n>-of-<parts>.zip" when there are several parts.
              schema:
                type: string
            Content-Length:
              description: The exact size, the bytes of the part in zip_parts.
              schema:
                type: integer
            X-LTC-Zip-Part:
              description: The part sent.
              schema:
                type: integer
            X-LTC-Zip-Parts:
              description: How many parts the batch has now.
              schema:
                type: integer
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/BatchZipNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
  /v1/batches/{batch_id}/cancel:
    post:
      tags: [Bulk documents]
      operationId: cancelBatch
      summary: Cancel the rows that have not started.
      description: Rows still queued are cancelled and count nothing. A document being made at that moment is finished, counted and kept, like the documents already made. Cancelling a finished batch changes nothing.
      security:
        - apiKey: []
      parameters:
        - name: batch_id
          in: path
          required: true
          description: The batch id that POST /v1/batches answered with.
          schema:
            type: string
            pattern: "^bat_[A-Za-z0-9]+$"
          example: bat_m4q8x2k7v1c9d3e6
      responses:
        "200":
          description: The batch after cancelling, with its rows and ZIP parts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
  /v1/certificates/{certificate_id}/revoke:
    post:
      tags: [Bulk documents]
      operationId: revokeCertificate
      summary: Revoke one of the account's certificates.
      description: |
        From then on the verification page shows the certificate as revoked. Revoking again changes
        nothing, and a revocation cannot be undone. A revoked record is kept for 90 days after the
        revocation, then deleted. An id of another account answers 404, like an unknown one.
      security:
        - apiKey: []
      parameters:
        - name: certificate_id
          in: path
          required: true
          description: '"crt_" and 20 characters of lower-case base32 (Crockford: no i, l, o or u). Upper case, and i or l for 1 and o for 0, are read too.'
          schema:
            type: string
          example: crt_8w3k5q0m2r7t9v4x6z1b
      responses:
        "200":
          description: The record, with status "revoked".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
  /v/{certificate_id}:
    get:
      tags: [Bulk documents]
      operationId: getCertificatePage
      summary: The public verification page of a certificate.
      description: |
        Public HTML page: Valid or Revoked, the facts as the issuer entered them, the issuing account
        as the domain of its sign-in email address ("an account with a personal email address" for
        public email providers), and a fixed disclaimer. Never cached; noindex.
      security: []
      parameters:
        - name: certificate_id
          in: path
          required: true
          description: '"crt_" and 20 characters of lower-case base32 (Crockford: no i, l, o or u). Upper case, and i or l for 1 and o for 0, are read too.'
          schema:
            type: string
          example: crt_8w3k5q0m2r7t9v4x6z1b
      responses:
        "200":
          $ref: "#/components/responses/CertificatePage"
        "404":
          description: No record to show (unknown id, revoked more than 90 days ago, or the account is suspended or being deleted). An HTML page.
          content:
            text/html:
              schema:
                type: string
        "503":
          description: Verification is switched off on this deployment. An HTML page.
          content:
            text/html:
              schema:
                type: string
  /v/{certificate_id}.json:
    get:
      tags: [Bulk documents]
      operationId: getCertificate
      summary: The same record as JSON.
      description: Public, never cached, readable from any website (Access-Control-Allow-Origin is *).
      security: []
      parameters:
        - name: certificate_id
          in: path
          required: true
          description: '"crt_" and 20 characters of lower-case base32 (Crockford: no i, l, o or u). Upper case, and i or l for 1 and o for 0, are read too.'
          schema:
            type: string
          example: crt_8w3k5q0m2r7t9v4x6z1b
      responses:
        "200":
          description: The record.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                enum: ["*"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/BatchNotConfigured"
