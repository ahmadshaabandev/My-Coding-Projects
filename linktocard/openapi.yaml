openapi: 3.1.0
info:
  title: Link To Card API
  version: "1.0.0"
  summary: Social-card images from HTML and CSS templates.
  description: |
    Renders Open Graph / social-card images from HTML and CSS templates.

    Two ways to get an image:
    - a signed URL (GET /v1/og/...) that you put in <meta property="og:image">;
    - POST /v1/images with an API key.

    One image is one rendered size. Cache hits and failed renders are never counted.

    GET /v1/inspect checks one page's link-preview tags and its og:image, like the
    free checker at https://linktocard.com/tools/og-checker. It never counts as an image.
    Human documentation: https://linktocard.com/docs/api
servers:
  - url: https://linktocard.com
tags:
  - name: Images
  - name: Account
  - name: Tools
  # feature:pdf
  - name: PDF
    description: |
      PDF documents from HTML templates: POST /v1/pdf, signed PDF links and stored PDFs.
      Rendered by Cloudflare Browser Run with JavaScript off and no network access. Card
      images are still rendered without a browser. Human documentation:
      https://linktocard.com/docs/pdf
  # /feature:pdf
paths:
  /v1/images:
    post:
      tags: [Images]
      operationId: createImage
      summary: Render one card, or return it from cache.
      description: |
        Renders the card and stores it for the plan's cache period, or returns the stored
        image when the same card (account, template, data, size, format) was rendered before.
        A cached response is not counted against the monthly allowance.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRequest"
            examples:
              starter:
                summary: A starter template
                value:
                  template: blog
                  data:
                    title: How we cut our build time in half
                    author: Maya Chen
              inline:
                summary: Inline HTML and CSS
                value:
                  html: '<div class="card"><h1>{{title}}</h1></div>'
                  css: ".card { display: flex; width: 100%; height: 100%; padding: 80px } h1 { font-size: 80px }"
                  data:
                    title: Hello from my own template
                  format: jpeg
      responses:
        "200":
          description: |
            The image. JSON by default; the image bytes when the request has "response": "binary".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-LTC-Cache:
              description: Binary responses only. miss when this request rendered (and counted) the image, hit when it was served from cache; in JSON responses see "cached".
              schema:
                type: string
                enum: [hit, miss]
            X-LTC-Image-Url:
              description: Binary responses only. The public URL of the stored image.
              schema:
                type: string
                format: uri
            X-LTC-Warnings:
              description: Binary responses only. The render warnings as a URI-encoded JSON array of strings.
              schema:
                type: string
            ETag:
              description: Binary responses only. The image id in double quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  /v1/usage:
    get:
      tags: [Account]
      operationId: getUsage
      summary: The allowance for the current period.
      security:
        - apiKey: []
      responses:
        "200":
          description: Usage for the current period.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/templates:
    get:
      tags: [Account]
      operationId: listTemplates
      summary: The starter templates and the account's own templates.
      security:
        - apiKey: []
      responses:
        "200":
          description: Templates that can be used as "template".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/inspect:
    get:
      tags: [Tools]
      operationId: inspectPage
      summary: Check one page's Open Graph and Twitter tags and its og:image.
      description: |
        Fetches the one page given in `url` as "LinkToCardBot/1.0 (+https://linktocard.com/bot)":
        https only, at most 3 redirects (each address checked), 5 seconds and 2 MB for the page.
        Measures the og:image (or twitter:image) with a HEAD then a GET, and reads robots.txt
        once (a block is a warning only). Never runs JavaScript, never crawls, never returns
        the page's HTML.

        A result is stored for 10 minutes; the same url within that time returns it with
        cached: true and is not counted. Uncached checks count against a daily allowance per
        API key (UTC day): Free 100, Starter 1000, Pro 5000. Counts no images.
      security:
        - apiKey: []
      parameters:
        - name: url
          in: query
          required: true
          description: Absolute https:// URL of the page, default port, no username or password. A fragment is dropped.
          schema:
            type: string
            format: uri
            maxLength: 2048
          example: https://example.com/blog/launch-week
      responses:
        "200":
          description: The check result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          description: forbidden (the address or a redirect target is not on the public internet) or account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/PageFetchFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/og/{site_id}/{template}.{ext}:
    get:
      tags: [Images]
      operationId: getSignedCard
      summary: A signed card URL, for og:image.
      description: |
        Public. Authenticated by the "sig" query parameter: the lowercase hexadecimal
        HMAC-SHA256, keyed with the site secret, of these lines joined with "\n":

          1. the path, e.g. /v1/og/s_4k2j9x0q1m7c8d5e/blog.png
          2. the parameter names (without "sig"), sorted, joined with ","
          3. one "name=value" line per parameter in that order, with decoded values

        Every other query parameter is template data. Names match ^[a-z][a-z0-9_]{0,31}$,
        each may appear once, at most 24 of them (plus "size"), values at most 1000 characters
        and without control characters. Path and query together are at most 4096 characters.

        The first request renders, stores and counts the image; later requests are served
        from cache and are not counted. HEAD never renders and never counts.
      security: []
      parameters:
        - name: site_id
          in: path
          required: true
          description: Site id from the dashboard.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: s_4k2j9x0q1m7c8d5e
        - name: template
          in: path
          required: true
          description: A starter template id (blog, dark, quote, launch, docs) or the id of a template owned by the site's account.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: blog
        - name: ext
          in: path
          required: true
          description: File extension; chooses the output format. jpg and jpeg both give JPEG.
          schema:
            type: string
            enum: [png, jpg, jpeg, webp]
        - name: sig
          in: query
          required: true
          description: The signature, 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: size
          in: query
          required: false
          description: Output size. Signed like any other parameter.
          schema:
            $ref: "#/components/schemas/Size"
        - name: data
          in: query
          required: false
          description: Template data, one query parameter per key (for example title=Hello&author=Zo%C3%AB).
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              maxLength: 1000
            example:
              title: Hello world
              author: Zoë Müller
        - name: If-None-Match
          in: header
          required: false
          description: An ETag from an earlier response; a match answers 304.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ImageFile"
        "304":
          description: Not modified (If-None-Match matched).
        "400":
          description: unsupported_size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          description: |
            invalid_signature (details.reason is one of missing_sig, malformed_sig, bad_param_name,
            duplicate_param, bad_value, too_many_params, url_too_long, signature_mismatch),
            or account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  # feature:pdf
  /v1/pdf:
    post:
      tags: [PDF]
      operationId: createPdf
      summary: Render one PDF document, or return it from storage.
      description: |
        Renders an HTML template (a PDF starter template, one of your own templates, or inline
        HTML and CSS) to a PDF and stores it for the plan's cache period. The same request again
        (account, template, data, page setup, header, footer, file name) returns the stored PDF
        and is not counted.

        PDFs are rendered by Cloudflare Browser Run with JavaScript turned off and no network
        access: remote images are downloaded first, through the same guarded fetcher as card
        images, and embedded in the document.

        A PDF of 1 to 10 pages counts as 2 images, plus 1 more for each further 10 pages
        started (11-20 pages: 3, 41-50 pages: 6). It is charged as one block: from the monthly
        allowance when it fits there, otherwise from one top-up with enough left, otherwise the
        answer is 402. A PDF may have at most 50 pages and at most 20 MB; a longer or larger one
        answers 422 and is not charged. On the Free plan every page carries the footer line
        "Made with Link To Card", and the header and footer are printed as plain text.

        Renders that reach the browser and fail because of the document (more than 50 pages, a
        PDF over 20 MB, a timeout, a document the browser cannot render, an unreadable page
        count), and PDFs that need more images than are left (402 after rendering), are capped
        at 20 per UTC day on Free and 200 on Starter and Pro, per account for this endpoint and
        per site for signed PDF links; past the cap the answer is 429 until 00:00 UTC. Failures
        of Browser Run itself never count. The signed links of all of an account's sites
        together are capped at 40 on Free and 400 on Starter and Pro as well. A render takes its
        place under a cap before it starts and gives it back when it ends with a PDF; while
        renders still running hold the last places, the answer is 429 with a Retry-After of a
        few seconds. A render cut off before it ends counts as a failure. Such a failure is remembered for 10 minutes: the
        identical request gets the same answer without being rendered or counted again (a
        remembered 402 is checked again against what is left now). Of identical requests sent
        at the same time only one renders; the others wait up to 90 seconds for its result.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfRequest"
            examples:
              starter:
                summary: The invoice starter template
                value:
                  template: invoice
                  data:
                    seller_name: Fernhill Studio
                    buyer_name: Okafor & Lund Architects
                    invoice_number: INV-2026-0142
                    issue_date: Nov 25, 2026
                    currency: USD
                    items:
                      - description: Brand strategy workshop
                        quantity: "2"
                        unit_price: "1,200.00"
                        amount: "2,400.00"
                    total: "2,400.00"
                  filename: invoice-INV-2026-0142.pdf
              inline:
                summary: Inline HTML and CSS with a page-numbered footer
                value:
                  html: "<h1>{{title}}</h1>{{#items}}<p>{{body}}</p>{{/items}}"
                  css: "h1 { font-family: 'Source Serif 4', serif }"
                  data:
                    title: Release notes
                    items:
                      - body: Faster exports.
                  pdf:
                    format: letter
                    margin: { top: 20mm, bottom: 20mm }
                    footer: '<div style="width:100%;font-size:9px;text-align:center">Page <span class="pageNumber"></span> of <span class="totalPages"></span></div>'
                  response: binary
      responses:
        "200":
          description: |
            JSON by default; the PDF itself when the request has "response": "binary".
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Content-Disposition:
              description: Binary responses only. inline; filename="<the sanitised file name>".
              schema:
                type: string
            X-LTC-Pages:
              description: Binary responses only. Pages in the PDF.
              schema:
                type: integer
            X-LTC-Credits-Used:
              description: Binary responses only. Images this request charged; 0 when the PDF was already stored.
              schema:
                type: integer
            X-LTC-Cache:
              description: Binary responses only. miss when this request rendered (and counted) the PDF, hit when it was served from storage.
              schema:
                type: string
                enum: [hit, miss]
            X-LTC-Pdf-Url:
              description: Binary responses only. The public URL of the stored PDF.
              schema:
                type: string
                format: uri
            X-LTC-Warnings:
              description: Binary responses only. The render warnings as a URI-encoded JSON array of strings.
              schema:
                type: string
            ETag:
              description: Binary responses only. The PDF id in double quotes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdf"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "402":
          $ref: "#/components/responses/PdfQuotaExceeded"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PdfPayloadTooLarge"
        "422":
          $ref: "#/components/responses/PdfUnprocessable"
        "429":
          $ref: "#/components/responses/PdfRateLimited"
        "500":
          $ref: "#/components/responses/PdfServerError"
        "503":
          $ref: "#/components/responses/PdfNotConfigured"
        "504":
          $ref: "#/components/responses/PdfRenderTimeout"
  /v1/pdf/{site_id}/{template}.pdf:
    get:
      tags: [PDF]
      operationId: getSignedPdf
      summary: A signed PDF link.
      description: |
        Public. Signed exactly like a card URL: "sig" is the lowercase hexadecimal HMAC-SHA256,
        keyed with the site secret, of the path (e.g. /v1/pdf/s_4k2j9x0q1m7c8d5e/invoice.pdf),
        the sorted parameter names joined with ",", and one "name=value" line per parameter,
        joined with "\n". The signature is checked before anything is rendered.

        format, landscape, filename and items are reserved; every other parameter is template
        data. items is the list for {{#items}} sections, as a JSON-encoded array of flat objects.
        The parameter rules of card URLs apply: names match ^[a-z][a-z0-9_]{0,31}$, at most 24
        parameters, each value (items included) at most 1000 characters without control
        characters, path and query together at most 4096 characters. Longer documents need
        POST /v1/pdf.

        The first request renders, stores and counts the PDF; later requests are served from
        storage and are not counted. Failed renders of a site's signed links count toward a
        daily cap per site and one for all of the account's sites together (see POST /v1/pdf),
        whoever opens them; reaching the site's cap stops only that site's new signed PDFs.

        HEAD never renders and never counts. It answers what the GET would answer before
        rendering: 402 when not enough images are left, 429 when the site's daily cap on failed
        renders is reached or, for a Free account, the free brake is on, and the status of a
        remembered failure (for example 422).
      security: []
      parameters:
        - name: site_id
          in: path
          required: true
          description: Site id from the dashboard.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: s_4k2j9x0q1m7c8d5e
        - name: template
          in: path
          required: true
          description: A PDF starter template id or the id of a template owned by the site's account.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: invoice
        - name: sig
          in: query
          required: true
          description: The signature, 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: format
          in: query
          required: false
          description: Paper format. Signed like any other parameter.
          schema:
            $ref: "#/components/schemas/PdfFormat"
        - name: landscape
          in: query
          required: false
          description: true or false (1 or 0). Signed like any other parameter.
          schema:
            type: string
            enum: ["true", "false", "1", "0"]
        - name: filename
          in: query
          required: false
          description: Download name; sanitised, at most 120 characters, always ending in .pdf. Default "<template>.pdf".
          schema:
            type: string
        - name: items
          in: query
          required: false
          description: The list for {{#items}} sections, JSON-encoded.
          schema:
            type: string
          example: '[{"description":"Design","amount":"1,200.00"}]'
        - name: data
          in: query
          required: false
          description: Template data, one query parameter per key.
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              maxLength: 1000
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PdfFile"
        "304":
          description: Not modified (If-None-Match matched).
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          $ref: "#/components/responses/PdfQuotaExceeded"
        "403":
          description: invalid_signature (details.reason as for card URLs) or account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/PdfUnprocessable"
        "429":
          $ref: "#/components/responses/PdfRateLimited"
        "500":
          $ref: "#/components/responses/PdfServerError"
        "503":
          $ref: "#/components/responses/PdfNotConfigured"
        "504":
          $ref: "#/components/responses/PdfRenderTimeout"
  # /feature:pdf
  /i/{account_id}/{id}.{ext}:
    get:
      tags: [Images]
      operationId: getStoredImage
      summary: A stored image, as returned in "url" by POST /v1/images.
      description: Public. Serves the stored image until its cache period ends. Never renders.
      security: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          example: u_hkr8wty4jftnyum3
        - name: id
          in: path
          required: true
          description: The image id.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: ext
          in: path
          required: true
          schema:
            type: string
            enum: [png, jpg, jpeg, webp]
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ImageFile"
        "304":
          description: Not modified (If-None-Match matched).
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
  # feature:pdf
  /i/{account_id}/{id}.pdf:
    get:
      tags: [PDF]
      operationId: getStoredPdf
      summary: A stored PDF, as returned in "url" by POST /v1/pdf.
      description: Public. Serves the stored PDF until its cache period ends, with the file name it was rendered with. Never renders.
      security: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          example: u_hkr8wty4jftnyum3
        - name: id
          in: path
          required: true
          description: The PDF id.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PdfFile"
        "304":
          description: Not modified (If-None-Match matched).
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/PdfNotConfigured"
  # /feature:pdf
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'An API key from the dashboard, sent as "Authorization: Bearer ltc_...".'
  headers:
    X-Request-Id:
      description: Identifier of this request. Quote it in support requests.
      schema:
        type: string
    X-LTC-Cache:
      description: miss when this request rendered (and counted) the image, hit when it was served from cache.
      schema:
        type: string
        enum: [hit, miss]
    ETag:
      description: The image id in double quotes.
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before the next request.
      schema:
        type: integer
  schemas:
    Size:
      type: string
      description: og is 1200x630, square is 1080x1080, portrait is 1080x1350.
      enum: [og, square, portrait]
      default: og
    Format:
      type: string
      enum: [png, jpeg, webp]
      default: png
    Data:
      type: object
      description: |
        Values for the template's placeholders. At most 24 keys; keys match
        ^[a-z][a-z0-9_]{0,31}$; values are strings of at most 1000 characters.
      maxProperties: 24
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,31}$"
      additionalProperties:
        type: string
        maxLength: 1000
    ImageRequest:
      type: object
      description: Send exactly one of "template" and "html". Unknown fields are refused.
      additionalProperties: false
      properties:
        template:
          type: string
          description: A starter template id (blog, dark, quote, launch, docs) or the id of one of your own templates (t_...).
        html:
          type: string
          description: Inline template HTML, at most 32 KB.
        css:
          type: string
          description: Inline template CSS, at most 32 KB. Only together with "html".
        data:
          $ref: "#/components/schemas/Data"
        size:
          $ref: "#/components/schemas/Size"
        width:
          type: integer
          description: Instead of "size", together with "height". Must equal one of the three sizes.
          enum: [1200, 1080]
        height:
          type: integer
          enum: [630, 1080, 1350]
        format:
          type: string
          description: jpg is accepted for jpeg.
          enum: [png, jpeg, jpg, webp]
          default: png
        response:
          type: string
          enum: [json, binary]
          default: json
      oneOf:
        - required: [template]
        - required: [html]
    Image:
      type: object
      required: [id, url, width, height, format, bytes, cached, template, created_at, expires_at, warnings, usage]
      properties:
        id:
          type: string
          description: 64 hexadecimal characters. The same card on the same account always has the same id.
        url:
          type: string
          format: uri
          description: Public URL of the image. Works until expires_at.
        width:
          type: integer
        height:
          type: integer
        format:
          $ref: "#/components/schemas/Format"
        bytes:
          type: integer
        cached:
          type: boolean
          description: false when this request rendered and counted the image, true when it was already stored.
        template:
          type: string
          description: The template id, or "inline" for an html request.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        warnings:
          type: array
          description: Things in the template that were removed or ignored. Empty when cached is true.
          items:
            type: string
        usage:
          $ref: "#/components/schemas/Usage"
    Usage:
      type: object
      required: [plan, period_start, period_end, limit, used, remaining, topup_remaining, total_remaining, cache_days, watermark]
      properties:
        plan:
          type: string
          enum: [free, starter, pro]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
          description: When "used" starts again at 0.
        limit:
          type: integer
          description: Images included per period.
        used:
          type: integer
        remaining:
          type: integer
        topup_remaining:
          type: integer
          description: Images left from purchased top-ups.
        total_remaining:
          type: integer
          description: remaining plus topup_remaining. New renders stop at 0.
        cache_days:
          type: integer
        watermark:
          type: boolean
    TemplateField:
      type: object
      required: [name, description, example, required]
      properties:
        name:
          type: string
        description:
          type: string
        example:
          type: string
        required:
          type: boolean
          description: Marks the field the design is built around. The API does not reject a request without it.
    StarterTemplate:
      type: object
      required: [id, name, description, fields]
      properties:
        id:
          type: string
          enum: [blog, dark, quote, launch, docs]
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/TemplateField"
    CustomTemplate:
      type: object
      required: [id, name, version, updated_at]
      properties:
        id:
          type: string
          example: t_mnd7x9sk3v8bwbmc
        name:
          type: string
        version:
          type: integer
          description: Goes up each time the template's HTML or CSS changes.
        updated_at:
          type: string
          format: date-time
    TemplateList:
      type: object
      required: [starter, custom]
      properties:
        starter:
          type: array
          items:
            $ref: "#/components/schemas/StarterTemplate"
        custom:
          type: array
          items:
            $ref: "#/components/schemas/CustomTemplate"
    CheckResult:
      type: object
      description: The result of GET /v1/inspect. Tag values are exactly as the page states them; null when missing.
      required: [id, url, final_url, status, fetched_at, response_ms, cached, expires_at, page, og, twitter, image, robots, checks, preview]
      properties:
        id:
          type: string
          pattern: "^chk_[0-9a-z]{16}$"
        url:
          type: string
          format: uri
          description: The normalised input URL.
        final_url:
          type: string
          format: uri
          description: The address after redirects; relative URLs are resolved against it.
        status:
          type: integer
        fetched_at:
          type: string
          format: date-time
        response_ms:
          type: integer
        cached:
          type: boolean
          description: true when the result came from the 10-minute store (not counted).
        expires_at:
          type: string
          format: date-time
        page:
          type: object
          required: [title, description, canonical, favicon, theme_color]
          properties:
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            canonical: { type: [string, "null"] }
            favicon: { type: [string, "null"] }
            theme_color: { type: [string, "null"] }
        og:
          type: object
          required: [title, description, image, image_alt, image_width, image_height, url, type, site_name]
          properties:
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            image: { type: [string, "null"] }
            image_alt: { type: [string, "null"] }
            image_width: { type: [string, "null"] }
            image_height: { type: [string, "null"] }
            url: { type: [string, "null"] }
            type: { type: [string, "null"] }
            site_name: { type: [string, "null"] }
        twitter:
          type: object
          required: [card, title, description, image, site]
          properties:
            card: { type: [string, "null"] }
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            image: { type: [string, "null"] }
            site: { type: [string, "null"] }
        image:
          description: The measured og:image (or twitter:image); null when the page has neither.
          oneOf:
            - type: "null"
            - type: object
              required: [url, status, content_type, bytes, width, height, aspect_ratio, response_ms]
              properties:
                url: { type: string }
                status: { type: [integer, "null"] }
                content_type: { type: [string, "null"] }
                bytes: { type: [integer, "null"] }
                width: { type: [integer, "null"] }
                height: { type: [integer, "null"] }
                aspect_ratio: { type: [number, "null"] }
                response_ms: { type: [integer, "null"] }
        robots:
          type: object
          required: [checked, allowed, note]
          properties:
            checked: { type: boolean }
            allowed: { type: [boolean, "null"] }
            note: { type: [string, "null"] }
        checks:
          type: array
          description: All twelve checks, always in this order of id.
          items:
            $ref: "#/components/schemas/CheckItem"
        preview:
          type: object
          required: [title, description, domain, site_name, image, favicon]
          properties:
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            domain: { type: string }
            site_name: { type: [string, "null"] }
            image:
              type: [string, "null"]
              description: Path on linktocard.com that shows the image while the result is stored.
            favicon:
              type: [string, "null"]
              description: Path on linktocard.com that shows the favicon while the result is stored.
    CheckItem:
      type: object
      required: [id, status, title, detail, fix]
      properties:
        id:
          type: string
          enum: [og_image, og_image_absolute, og_image_https, og_image_reachable, og_image_size, og_image_dimensions, og_image_ratio, twitter_card, og_title, og_description, robots, response_time]
        status:
          type: string
          enum: [pass, warn, fail]
        title:
          type: string
        detail:
          type: string
        fix:
          type: [string, "null"]
          description: What to change; null when the check passes.
    # feature:pdf
    PdfFormat:
      type: string
      enum: [a4, letter, a5]
      default: a4
    PdfData:
      type: object
      description: |
        Values for a PDF template's placeholders. At most 40 keys; keys match
        ^[a-z][a-z0-9_]{0,31}$; values are strings or numbers of at most 2000 characters.
        "items" is the one list: {{#items}} ... {{/items}} repeats once per entry. It has at
        most 200 entries of at most 16 fields, each field at most 500 characters. Templates
        never compute: send totals as display text.
      maxProperties: 40
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,31}$"
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            maxProperties: 16
            propertyNames:
              pattern: "^[a-z][a-z0-9_]{0,31}$"
            additionalProperties:
              type: [string, number]
              maxLength: 500
      additionalProperties:
        type: [string, number]
        maxLength: 2000
    PdfMargin:
      type: object
      description: CSS lengths (a number with mm, cm, in or px, or 0), each at most 60mm. A side that is not given keeps the template's margin, or 15mm.
      additionalProperties: false
      properties:
        top:
          type: string
          example: 20mm
        right:
          type: string
        bottom:
          type: string
        left:
          type: string
    PdfPage:
      type: object
      description: Page setup. Unknown fields are refused. Starter templates bring their own defaults.
      additionalProperties: false
      properties:
        format:
          $ref: "#/components/schemas/PdfFormat"
        landscape:
          type: boolean
          default: false
        margin:
          $ref: "#/components/schemas/PdfMargin"
        header:
          type: string
          description: HTML printed at the top of every page, at most 32 KB, sanitised and filled in like the document. It does not use the document's CSS; on Starter and Pro, style it inline or with a <style> element of its own. <span class="pageNumber"></span> and <span class="totalPages"></span> print the page numbers (the class names are case-sensitive).
        footer:
          type: string
          description: HTML printed at the bottom of every page, with the same rules as header. On the Free plan the "Made with Link To Card" line is printed below it, and the header and footer are printed as plain text in a fixed style (their text, line breaks and the pageNumber, totalPages, date and title classes; no markup, styles or images, with a warning), cut off after the last whole line that fits in their margin.
    PdfRequest:
      type: object
      description: Send exactly one of "template" and "html". Unknown fields are refused.
      additionalProperties: false
      properties:
        template:
          type: string
          description: A PDF starter template (invoice, receipt, quote, certificate, report) or the id of one of your own templates (t_...).
        html:
          type: string
          description: Inline template HTML, at most 1 MB once placeholders are filled in.
        css:
          type: string
          description: Inline template CSS, at most 256 KB. Only together with "html".
        data:
          $ref: "#/components/schemas/PdfData"
        pdf:
          $ref: "#/components/schemas/PdfPage"
        filename:
          type: string
          description: Download name, sanitised to letters, digits, space, ".", "_", "-", "(" and ")", at most 120 characters, always ending in .pdf. Default "<template>.pdf", or "document.pdf" for inline HTML.
        response:
          type: string
          enum: [url, binary]
          default: url
      oneOf:
        - required: [template]
        - required: [html]
    Pdf:
      type: object
      required: [id, url, pages, bytes, credits_used, cached, template, filename, created_at, expires_at, warnings, usage]
      properties:
        id:
          type: string
          description: 64 hexadecimal characters. The same PDF request on the same account always has the same id.
        url:
          type: string
          format: uri
          description: Public URL of the stored PDF. Works until expires_at.
        pages:
          type: integer
        bytes:
          type: integer
        credits_used:
          type: integer
          description: Images this request charged; 0 when the PDF was already stored.
        cached:
          type: boolean
          description: false when this request rendered and counted the PDF, true when it was already stored.
        template:
          type: string
          description: The template id, or "inline" for an html request.
        filename:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        warnings:
          type: array
          description: Things in the template that were removed or ignored. Empty when cached is true.
          items:
            type: string
        usage:
          $ref: "#/components/schemas/Usage"
    # /feature:pdf
    ErrorCode:
      type: string
      description: |
        Stable error code. HTTP status per code:
        invalid_request 400, unsupported_size 400, unsupported_format 400,
        unauthorized 401, invalid_api_key 401, quota_exceeded 402,
        invalid_signature 403, account_suspended 403, plan_required 403, forbidden 403,
        verification_required 403, not_found 404, conflict 409, gone 410,
        payload_too_large 413, unsupported_media_type 415, template_error 422,
        image_fetch_failed 422, page_fetch_failed 422, rate_limited 429,
        render_failed 500, internal_error 500, not_configured 503, render_timeout 504.
        unauthorized, plan_required, conflict and unsupported_media_type are returned only
        by the dashboard's own endpoints; forbidden by the dashboard and by GET /v1/inspect
        for an address that is not on the public internet; verification_required only by
        the free tools on the website; gone is reserved.
      enum:
        - invalid_request
        - unsupported_size
        - unsupported_format
        - unauthorized
        - invalid_api_key
        - quota_exceeded
        - invalid_signature
        - account_suspended
        - plan_required
        - forbidden
        - verification_required
        - not_found
        - conflict
        - gone
        - payload_too_large
        - unsupported_media_type
        - template_error
        - image_fetch_failed
        - page_fetch_failed
        - rate_limited
        - render_failed
        - internal_error
        - not_configured
        - render_timeout
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, docs]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Written for a developer; says what to change. The wording may change.
            docs:
              type: string
              format: uri
              example: https://linktocard.com/docs/api#errors
            details:
              type: object
              description: Present for some errors, for example reason, usage, unknown_fields, limit.
              additionalProperties: true
  responses:
    ImageFile:
      description: The image.
      headers:
        Cache-Control:
          description: public, max-age=86400, or fewer seconds when the stored image expires sooner.
          schema:
            type: string
        ETag:
          $ref: "#/components/headers/ETag"
        X-LTC-Cache:
          $ref: "#/components/headers/X-LTC-Cache"
        Cross-Origin-Resource-Policy:
          description: cross-origin, so any site may embed the image.
          schema:
            type: string
            enum: [cross-origin]
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    BadRequest:
      description: invalid_request, unsupported_size or unsupported_format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: 'Unknown field "tempalte". Allowed fields: template, html, css, data, size, width, height, format, response.'
              docs: https://linktocard.com/docs/api#errors
              details:
                unknown_fields: [tempalte]
    InvalidApiKey:
      description: invalid_api_key. The Authorization header is missing, or the key is wrong or revoked.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QuotaExceeded:
      description: quota_exceeded. The allowance is used up and the card is not cached. details.usage is the Usage object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountSuspended:
      description: account_suspended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: not_found. Unknown path, site, template or image, or an image whose cache period has ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: payload_too_large. The body is over 96 KB, or the template HTML or CSS is over 32 KB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: template_error or image_fetch_failed. Nothing is stored or counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PageFetchFailed:
      description: page_fetch_failed. The page could not be read. details.reason is dns_failed, connect_failed, timeout, too_many_redirects, insecure_redirect, bad_redirect, http_error (details.status is the site's status) or not_html.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: rate_limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: render_failed or internal_error. Nothing is counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RenderTimeout:
      description: render_timeout. The render took longer than 10 seconds. Nothing is counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # feature:pdf
    PdfFile:
      description: The PDF.
      headers:
        Content-Disposition:
          description: inline; filename="<the file name it was rendered with>".
          schema:
            type: string
        Cache-Control:
          description: public, max-age=86400, or fewer seconds when the stored PDF expires sooner.
          schema:
            type: string
        ETag:
          description: The PDF id in double quotes.
          schema:
            type: string
        X-LTC-Cache:
          description: miss when this request rendered (and counted) the PDF, hit when it was served from storage.
          schema:
            type: string
            enum: [hit, miss]
        X-LTC-Pages:
          description: Pages in the PDF.
          schema:
            type: integer
        Cross-Origin-Resource-Policy:
          description: cross-origin, so any site may link or embed the PDF.
          schema:
            type: string
            enum: [cross-origin]
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    PdfQuotaExceeded:
      description: |
        quota_exceeded. Not enough is left in one place for this PDF: it is charged as one block,
        from the monthly allowance or from one top-up, and is never split. Checked before rendering
        (a PDF needs at least 2 images) and again with its real page count. details.usage is the
        Usage object, details.units_needed the images the PDF needs. Nothing is charged. A 402
        after rendering counts toward the daily cap on failed renders and is remembered for 10
        minutes: the identical request is checked against what is left then, without rendering.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfPayloadTooLarge:
      description: payload_too_large. The request body is over 1.5 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfUnprocessable:
      description: |
        template_error (the template cannot be used as written: more than 50 pages, HTML over 1 MB,
        CSS over 256 KB, images over 10 MB together, a PDF over 20 MB (details.max_bytes), @import,
        an external @font-face, a document the browser could not render, ...) or
        image_fetch_failed (a remote image could not be downloaded). Nothing is stored or charged.
        When the browser was reached (more than 50 pages, a PDF over 20 MB, a document it could
        not render), it counts toward the daily cap on failed renders, and the identical request
        gets the same answer for 10 minutes without being rendered again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfNotConfigured:
      description: 'not_configured. PDF rendering is not enabled on this deployment ("PDF rendering is not enabled yet.").'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfRenderTimeout:
      description: render_timeout. Loading or printing the document took longer than 30 seconds. Nothing is charged; it counts toward the daily cap on failed renders, and the identical request gets the same answer for 10 minutes without being rendered again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfRateLimited:
      description: |
        rate_limited. Nothing is charged. One of: a rate limit; the daily cap on failed renders
        (20 per UTC day on Free, 200 on Starter and Pro, per account for POST /v1/pdf and per
        site for signed links; Retry-After is the time until 00:00 UTC, details { limit, scope:
        account, site or sites, period_seconds, retry_after_seconds }; sites: 40 and 400 for the
        signed links of all of an account's sites together); renders still running that hold the last places
        under such a cap (Retry-After of a few seconds, details { limit, scope, running,
        retry_after_seconds }); the brake on the Free plan and
        the free tools while they used far more browser time than usual in the last 24 hours
        (Retry-After 3600; it lifts as that use ages out of the 24-hour window); an identical
        request still making this PDF after 90 seconds (Retry-After until its place can be
        taken over); or the renderer busy for a moment.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfServerError:
      description: |
        render_failed or internal_error. Nothing is charged. render_failed: the renderer failed,
        could not be reached or did not finish sending the PDF; these failures of Browser Run do
        not count toward the daily cap on failed renders and are not remembered. It is also the
        answer for a PDF whose page count cannot be read, which does count.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # /feature:pdf
