          $ref: "#/components/responses/LinkUnprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/LinkCardsNotConfigured"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  /v1/link/{site_id}/{template}.{ext}:
    get:
      tags: [Link cards]
      operationId: getSignedLinkCard
      summary: A signed link card URL, for og:image.
      description: |
        Public. Signed exactly like a card URL, over the path (e.g. /v1/link/s_4k2j9x0q1m7c8d5e/blog.png),
        the sorted parameter names joined with ",", and one "name=value" line per parameter with
        decoded values, joined with "\n". "url" (the page) is required and signed like every other
        parameter; "size" chooses the size; "open" is refused; every other parameter is template
        data that wins over the page's values. The page address, like any value, is at most 1000
        characters, and path and query together at most 4096 characters.

        The first request reads the page and makes the card (1 image). Later requests are served from
        storage until the card is due for a refresh; then the page is read again, and a new card is
        made and counted only when the page has changed. When the page cannot be read at a refresh,
        the last card is served with X-LTC-Cache "stale". Page reads behind one site's links count
        against a daily allowance per site, by plan: Free 100, Starter 1000, Pro 5000. HEAD never
        reads the page, never renders and never counts.
      security: []
      parameters:
        - name: site_id
          in: path
          required: true
          description: Site id from the dashboard.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: s_4k2j9x0q1m7c8d5e
        - name: template
          in: path
          required: true
          description: A starter template id (blog, dark, quote, launch, docs) or the id of a template owned by the site's account.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: blog
        - name: ext
          in: path
          required: true
          description: File extension; chooses the output format. jpg and jpeg both give JPEG.
          schema:
            type: string
            enum: [png, jpg, jpeg, webp]
        - name: url
          in: query
          required: true
          description: The page, a public https:// URL. Signed like every other parameter.
          schema:
            type: string
            format: uri
            maxLength: 1000
          example: https://example.com/blog/launch-week
        - name: sig
          in: query
          required: true
          description: The signature, 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: size
          in: query
          required: false
          description: Output size. Signed like any other parameter.
          schema:
            $ref: "#/components/schemas/Size"
        - name: data
          in: query
          required: false
          description: Template data that wins over the page's values, one query parameter per key (for example tag=Launch+week).
          style: form
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
              maxLength: 1000
        - name: If-None-Match
          in: header
          required: false
          description: An ETag from an earlier response; a match answers 304.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/LinkImageFile"
        "304":
          description: Not modified (If-None-Match matched).
        "400":
          description: |
            invalid_request (the page address is not a public https:// URL on the default port, or
            details.reason size_not_supported: a starter template signed with size=email, refused
            before the page is read) or unsupported_size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          description: |
            invalid_signature (details.reason is one of missing_sig, malformed_sig, bad_param_name,
            duplicate_param, bad_value, too_many_params, url_too_long, signature_mismatch, missing_url,
            open_not_supported), forbidden (the page is not on the public internet) or
            account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/LinkUnprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/LinkCardsNotConfigured"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  # /feature:linkcards
  # feature:charts
  /v1/charts:
    post:
      tags: [Charts]
      operationId: createChart
      summary: Draw one chart image, or return it from storage.
      description: |
        Draws the chart and stores it for the plan's cache period, or returns the stored image when
        the same chart (account, chart JSON in canonical form, format) was drawn before. A chart counts
        one image the first time it is drawn. When its stored copy has expired, it is drawn and stored
        again without counting, for as long as the count is remembered (see /docs/charts#what-counts).
        A chart counted through a signed URL is not counted again here, and the other way round. Same
        rate limits as POST /v1/images.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartRequest"
            examples:
              line:
                summary: A line chart for an email
                value:
                  type: line
                  title: Visitors per month
                  labels: [Jan, Feb, Mar, Apr]
                  series:
                    - name: Website
                      data: [1200, 1350, 1280, 1610]
                  width: 600
                  height: 300
                  scale: 2
                  format: png
      responses:
        "200":
          description: The stored chart image.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartImage"
        "400":
          description: invalid_request (the chart JSON is refused; the message names the field and details.field holds its path) or unsupported_format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ChartsNotConfigured"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  /v1/chart/{site_id}.{ext}:
    get:
      tags: [Charts]
      operationId: getSignedChart
      summary: A signed chart URL, for an <img>.
      description: |
        Public. Authenticated by the "sig" query parameter: the lowercase hexadecimal
        HMAC-SHA256, keyed with the site secret, of these lines joined with "\n":

          1. the path, e.g. /v1/chart/s_4k2j9x0q1m7c8d5e.png
          2. c
          3. "c=" followed by the chart JSON as it is in the URL, decoded (not URL-encoded)

        The URL takes "c" and "sig" and nothing else. The signature is checked before the chart
        is read. The first request draws, stores and counts the chart; later requests are served
        from storage and are not counted, and a request after the stored copy expired draws it
        again without counting while the count is remembered. HEAD never draws and never counts.
      security: []
      parameters:
        - name: site_id
          in: path
          required: true
          description: Site id from the dashboard.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
          example: s_4k2j9x0q1m7c8d5e
        - name: ext
          in: path
          required: true
          description: File extension; chooses the output format. jpg and jpeg both give JPEG.
          schema:
            type: string
            enum: [png, jpg, jpeg, webp]
        - name: c
          in: query
          required: true
          description: The chart JSON (ChartRequest without "format") as text on one line, as JSON.stringify writes it, URL-encoded.
          schema:
            type: string
          example: '{"type":"bar","labels":["Q1","Q2"],"series":[{"data":[120,145]}]}'
        - name: sig
          in: query
          required: true
          description: The signature, 64 hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: If-None-Match
          in: header
          required: false
          description: An ETag from an earlier response; a match answers 304.
          schema:
            type: string
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              description: public, max-age=N, up to 30 days and never past the stored copy's expiry, so mail apps and image proxies can keep it.
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            X-LTC-Cache:
              $ref: "#/components/headers/X-LTC-Cache"
            X-LTC-Credits-Used:
              description: 1 for the request that counted the chart, 0 otherwise.
              schema:
                type: string
                enum: ["0", "1"]
            Cross-Origin-Resource-Policy:
              description: cross-origin, so any site may embed the image.
              schema:
                type: string
                enum: [cross-origin]
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match matched).
        "400":
          description: invalid_request (the chart JSON is refused; the message names the field and details.field holds its path). Answered after the signature is verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          $ref: "#/components/responses/QuotaExceeded"
        "403":
          description: |
            invalid_signature (details.reason is one of missing_sig, malformed_sig, duplicate_param,
            unknown_param, missing_chart, bad_value, url_too_long, signature_mismatch), or
            account_suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ChartsNotConfigured"
        "504":
          $ref: "#/components/responses/RenderTimeout"
  # /feature:charts
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'An API key from the dashboard, sent as "Authorization: Bearer ltc_...".'
  headers:
    X-Request-Id:
      description: Identifier of this request. Quote it in support requests.
      schema:
        type: string
    X-LTC-Cache:
      description: miss when this request rendered (and counted) the image, hit when it was served from cache.
      schema:
        type: string
        enum: [hit, miss]
    ETag:
      description: The image id in double quotes.
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before the next request.
      schema:
        type: integer
  schemas:
    Size:
      type: string
      description: |
        og is 1200x630, square is 1080x1080, portrait is 1080x1350, email is 1200x400.
        The five starter templates (blog, dark, quote, launch, docs) take og, square and
        portrait. The email size is for your own templates and inline HTML, which take every
        size. A starter template at the email size (size email, or width 1200 and height 400)
        answers 400 invalid_request with details.reason size_not_supported and
        details.supported_sizes.
      enum: [og, square, portrait, email]
      default: og
    Format:
      type: string
      enum: [png, jpeg, webp]
      default: png
    Data:
      type: object
      description: |
        Values for the template's placeholders. At most 24 keys; keys match
        ^[a-z][a-z0-9_]{0,31}$; values are strings of at most 1000 characters.
      maxProperties: 24
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,31}$"
      additionalProperties:
        type: string
        maxLength: 1000
    ImageRequest:
      type: object
      description: Send exactly one of "template" and "html". Unknown fields are refused.
      additionalProperties: false
      properties:
        template:
          type: string
          description: A starter template id (blog, dark, quote, launch, docs) or the id of one of your own templates (t_...).
        html:
          type: string
          description: Inline template HTML, at most 32 KB.
        css:
          type: string
          description: Inline template CSS, at most 32 KB. Only together with "html".
        data:
          $ref: "#/components/schemas/Data"
        size:
          $ref: "#/components/schemas/Size"
        width:
          type: integer
          description: Instead of "size", together with "height". Must equal one of the four sizes.
          enum: [1200, 1080]
        height:
          type: integer
          enum: [630, 1080, 1350]
        format:
          type: string
          description: jpg is accepted for jpeg.
          enum: [png, jpeg, jpg, webp]
          default: png
        response:
          type: string
          enum: [json, binary]
          default: json
      oneOf:
        - required: [template]
        - required: [html]
    Image:
      type: object
      required: [id, url, width, height, format, bytes, cached, template, created_at, expires_at, warnings, usage]
      properties:
        id:
          type: string
          description: 64 hexadecimal characters. The same card on the same account always has the same id.
        url:
          type: string
          format: uri
          description: Public URL of the image. Works until expires_at.
        width:
          type: integer
        height:
          type: integer
        format:
          $ref: "#/components/schemas/Format"
        bytes:
          type: integer
        cached:
          type: boolean
          description: false when this request rendered and counted the image, true when it was already stored.
        template:
          type: string
          description: The template id, or "inline" for an html request.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        warnings:
          type: array
          description: Things in the template that were removed or ignored. Empty when cached is true.
          items:
            type: string
        usage:
          $ref: "#/components/schemas/Usage"
    Usage:
      type: object
      required: [plan, period_start, period_end, limit, used, remaining, topup_remaining, total_remaining, cache_days, watermark]
      properties:
        plan:
          type: string
          enum: [free, starter, pro]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
          description: When "used" starts again at 0.
        limit:
          type: integer
          description: Images included per period.
        used:
          type: integer
        remaining:
          type: integer
        topup_remaining:
          type: integer
          description: Images left from purchased top-ups.
        total_remaining:
          type: integer
          description: remaining plus topup_remaining. New renders stop at 0.
        cache_days:
          type: integer
        watermark:
          type: boolean
    TemplateField:
      type: object
      required: [name, description, example, required]
      properties:
        name:
          type: string
        description:
          type: string
        example:
          type: string
        required:
          type: boolean
          description: Marks the field the design is built around. The API does not reject a request without it.
    StarterTemplate:
      type: object
      required: [id, name, description, fields]
      properties:
        id:
          type: string
          enum: [blog, dark, quote, launch, docs]
        name:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/TemplateField"
    CustomTemplate:
      type: object
      required: [id, name, version, updated_at]
      properties:
        id:
          type: string
          example: t_mnd7x9sk3v8bwbmc
        name:
          type: string
        version:
          type: integer
          description: Goes up each time the template's HTML or CSS changes.
        updated_at:
          type: string
          format: date-time
    TemplateList:
      type: object
      required: [starter, custom]
      properties:
        starter:
          type: array
          items:
            $ref: "#/components/schemas/StarterTemplate"
        custom:
          type: array
          items:
            $ref: "#/components/schemas/CustomTemplate"
    CheckResult:
      type: object
      description: The result of GET /v1/inspect. Tag values are exactly as the page states them; null when missing.
      required: [id, url, final_url, status, fetched_at, response_ms, cached, expires_at, page, og, twitter, image, robots, checks, preview]
      properties:
        id:
          type: string
          pattern: "^chk_[0-9a-z]{16}$"
        url:
          type: string
          format: uri
          description: The normalised input URL.
        final_url:
          type: string
          format: uri
          description: The address after redirects; relative URLs are resolved against it.
        status:
          type: integer
        fetched_at:
          type: string
          format: date-time
        response_ms:
          type: integer
        cached:
          type: boolean
          description: true when the result came from the 10-minute store (not counted).
        expires_at:
          type: string
          format: date-time
        page:
          type: object
          required: [title, description, canonical, favicon, theme_color]
          properties:
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            canonical: { type: [string, "null"] }
            favicon: { type: [string, "null"] }
            theme_color: { type: [string, "null"] }
        og:
          type: object
          required: [title, description, image, image_alt, image_width, image_height, url, type, site_name]
          properties:
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            image: { type: [string, "null"] }
            image_alt: { type: [string, "null"] }
            image_width: { type: [string, "null"] }
            image_height: { type: [string, "null"] }
            url: { type: [string, "null"] }
            type: { type: [string, "null"] }
            site_name: { type: [string, "null"] }
        twitter:
          type: object
          required: [card, title, description, image, site]
          properties:
            card: { type: [string, "null"] }
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            image: { type: [string, "null"] }
            site: { type: [string, "null"] }
        image:
          description: The measured og:image (or twitter:image); null when the page has neither.
          oneOf:
            - type: "null"
            - type: object
              required: [url, status, content_type, bytes, width, height, aspect_ratio, response_ms]
              properties:
                url: { type: string }
                status: { type: [integer, "null"] }
                content_type: { type: [string, "null"] }
                bytes: { type: [integer, "null"] }
                width: { type: [integer, "null"] }
                height: { type: [integer, "null"] }
                aspect_ratio: { type: [number, "null"] }
                response_ms: { type: [integer, "null"] }
        robots:
          type: object
          required: [checked, allowed, note]
          properties:
            checked: { type: boolean }
            allowed: { type: [boolean, "null"] }
            note: { type: [string, "null"] }
        checks:
          type: array
          description: All twelve checks, always in this order of id.
          items:
            $ref: "#/components/schemas/CheckItem"
        preview:
          type: object
          required: [title, description, domain, site_name, image, favicon]
          properties:
            title: { type: [string, "null"] }
            description: { type: [string, "null"] }
            domain: { type: string }
            site_name: { type: [string, "null"] }
            image:
              type: [string, "null"]
              description: Path on linktocard.com that shows the image while the result is stored.
            favicon:
              type: [string, "null"]
              description: Path on linktocard.com that shows the favicon while the result is stored.
    CheckItem:
      type: object
      required: [id, status, title, detail, fix]
      properties:
        id:
          type: string
          enum: [og_image, og_image_absolute, og_image_https, og_image_reachable, og_image_size, og_image_dimensions, og_image_ratio, twitter_card, og_title, og_description, robots, response_time]
        status:
          type: string
          enum: [pass, warn, fail]
        title:
          type: string
        detail:
          type: string
        fix:
          type: [string, "null"]
          description: What to change; null when the check passes.
    # feature:pdf
    PdfFormat:
      type: string
      enum: [a4, letter, a5]
      default: a4
    PdfData:
      type: object
      description: |
        Values for a PDF template's placeholders. At most 40 keys; keys match
        ^[a-z][a-z0-9_]{0,31}$; values are strings or numbers of at most 2000 characters.
        "items" is the one list: {{#items}} ... {{/items}} repeats once per entry. It has at
        most 200 entries of at most 16 fields, each field at most 500 characters. Templates
        never compute: send totals as display text.
      maxProperties: 40
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,31}$"
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            maxProperties: 16
            propertyNames:
              pattern: "^[a-z][a-z0-9_]{0,31}$"
            additionalProperties:
              type: [string, number]
              maxLength: 500
      additionalProperties:
        type: [string, number]
        maxLength: 2000
    PdfMargin:
      type: object
      description: CSS lengths (a number with mm, cm, in or px, or 0), each at most 60mm. A side that is not given keeps the template's margin, or 15mm.
      additionalProperties: false
      properties:
        top:
          type: string
          example: 20mm
        right:
          type: string
        bottom:
          type: string
        left:
          type: string
    PdfPage:
      type: object
      description: Page setup. Unknown fields are refused. Starter templates bring their own defaults.
      additionalProperties: false
      properties:
        format:
          $ref: "#/components/schemas/PdfFormat"
        landscape:
          type: boolean
          default: false
        margin:
          $ref: "#/components/schemas/PdfMargin"
        header:
          type: string
          description: HTML printed at the top of every page, at most 32 KB, sanitised and filled in like the document. It does not use the document's CSS; on Starter and Pro, style it inline or with a <style> element of its own. <span class="pageNumber"></span> and <span class="totalPages"></span> print the page numbers (the class names are case-sensitive).
        footer:
          type: string
          description: HTML printed at the bottom of every page, with the same rules as header. On the Free plan the "Made with Link To Card" line is printed below it, and the header and footer are printed as plain text in a fixed style (their text, line breaks and the pageNumber, totalPages, date and title classes; no markup, styles or images, with a warning), cut off after the last whole line that fits in their margin.
    PdfRequest:
      type: object
      description: Send exactly one of "template" and "html". Unknown fields are refused.
      additionalProperties: false
      properties:
        template:
          type: string
          description: A PDF starter template (invoice, receipt, quote, certificate, report) or the id of one of your own templates (t_...).
        html:
          type: string
          description: Inline template HTML, at most 1 MB once placeholders are filled in.
        css:
          type: string
          description: Inline template CSS, at most 256 KB. Only together with "html".
        data:
          $ref: "#/components/schemas/PdfData"
        pdf:
          $ref: "#/components/schemas/PdfPage"
        filename:
          type: string
          description: Download name, sanitised to letters, digits, space, ".", "_", "-", "(" and ")", at most 120 characters, always ending in .pdf. Default "<template>.pdf", or "document.pdf" for inline HTML.
        response:
          type: string
          enum: [url, binary]
          default: url
      oneOf:
        - required: [template]
        - required: [html]
    Pdf:
      type: object
      required: [id, url, pages, bytes, credits_used, cached, template, filename, created_at, expires_at, warnings, usage]
      properties:
        id:
          type: string
          description: 64 hexadecimal characters. The same PDF request on the same account always has the same id.
        url:
          type: string
          format: uri
          description: Public URL of the stored PDF. Works until expires_at.
        pages:
          type: integer
        bytes:
          type: integer
        credits_used:
          type: integer
          description: Images this request charged; 0 when the PDF was already stored.
        cached:
          type: boolean
          description: false when this request rendered and counted the PDF, true when it was already stored.
        template:
          type: string
          description: The template id, or "inline" for an html request.
        filename:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        warnings:
          type: array
          description: Things in the template that were removed or ignored. Empty when cached is true.
          items:
            type: string
        usage:
          $ref: "#/components/schemas/Usage"
    # /feature:pdf
    # feature:batch
    BatchRequest:
      type: object
      description: Unknown fields are refused.
      additionalProperties: false
      required: [template, rows]
      properties:
        template:
          type: string
          description: A PDF starter template (invoice, receipt, quote, certificate, report) or the id of one of your own templates (t_...).
        rows:
          type: array
          description: One data object per document, with the rules of PdfData. At most Free 25, Starter 500, Pro 2000 rows.
          minItems: 1
          maxItems: 2000
          items:
            $ref: "#/components/schemas/PdfData"
        pdf:
          type: object
          description: Page setup for every document. Default the template's own.
          additionalProperties: false
          properties:
            format:
              $ref: "#/components/schemas/PdfFormat"
            landscape:
              type: boolean
        filename:
          type: string
          description: 'File name pattern; {{key}} is the row''s value, {{n}} the row''s number from 1. Cleaned like the filename of POST /v1/pdf. Default "<template>-{{n}}.pdf" for a starter template (certificate-1.pdf), "document-{{n}}.pdf" for one of your own.'
          example: "certificate-{{recipient_name}}.pdf"
        verify:
          type: boolean
          description: Make a verification record per document; each row gains certificate_id, verify_url and verify_qr after its data was checked (so the data value limits do not apply to them), and may not bring its own. Default true for the certificate template, false for the others.
    BatchStatus:
      type: string
      description: queued and running change; done, partial (some failed), failed (none made) and cancelled are final.
      enum: [queued, running, done, partial, failed, cancelled]
    BatchRowStatus:
      type: string
      enum: [queued, running, done, failed, cancelled]
    BatchCounts:
      type: object
      description: Rows per status.
      required: [queued, running, done, failed, cancelled]
      properties:
        queued:
          type: integer
        running:
          type: integer
        done:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
    BatchRow:
      type: object
      required: [index, status, filename, pages, credits_used, url, error, certificate_id, verify_url]
      properties:
        index:
          type: integer
          description: Position in "rows", from 0.
        status:
          $ref: "#/components/schemas/BatchRowStatus"
        filename:
          type: string
          description: The document's file name, unique within the batch.
        pages:
          type: [integer, "null"]
        credits_used:
          type: [integer, "null"]
          description: Images this document counted (0 when it was already stored); null while it is not made, and for a document that failed. The rare exception is a document that was made and counted but could not be recorded in the batch (internal_error, whose message says so); it shows what it counted, also while it waits to be recorded again.
        url:
          type: [string, "null"]
          format: uri
          description: The stored PDF, public until the plan's cache period ends; null before and after.
        error:
          description: Why the document failed (an error code and message as in Error), why its last attempt failed while it is queued again, or null.
          oneOf:
            - type: "null"
            - type: object
              required: [code, message]
              properties:
                code:
                  $ref: "#/components/schemas/ErrorCode"
                message:
                  type: string
        certificate_id:
          type: [string, "null"]
          description: Null unless the document is done (a record is written only when its document is made).
        verify_url:
          type: [string, "null"]
          format: uri
    BatchZipPart:
      type: object
      required: [part, entries, bytes, url]
      properties:
        part:
          type: integer
          description: From 1.
        entries:
          type: integer
          description: PDFs in this part, at most 500.
        bytes:
          type: integer
          description: The exact size of the download, at most 2 GB.
        url:
          type: string
          format: uri
          description: GET /v1/batches/{batch_id}/zip?part=N.
    Batch:
      type: object
      required: [id, status, template, verify, total, counts, pages, credits_used, created_at, started_at, finished_at, cancelled_at, zip_url]
      properties:
        id:
          type: string
          example: bat_m4q8x2k7v1c9d3e6
        status:
          $ref: "#/components/schemas/BatchStatus"
        template:
          type: string
        verify:
          type: boolean
        total:
          type: integer
        counts:
          $ref: "#/components/schemas/BatchCounts"
        pages:
          type: integer
          description: Pages of every document made so far.
        credits_used:
          type: integer
          description: Images the documents made so far used together.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the first document started.
        finished_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        zip_url:
          type: string
          format: uri
          description: GET /v1/batches/{batch_id}/zip, part 1. It answers 404 while the batch has no stored document.
        rows:
          type: array
          description: One entry per row, in the order of the request. Present in GET /v1/batches/{batch_id} and after cancelling.
          items:
            $ref: "#/components/schemas/BatchRow"
        zip_parts:
          type: array
          description: The ZIP downloads, in row order. Present in every answer about one batch (empty until a document is made), not in the listing.
          items:
            $ref: "#/components/schemas/BatchZipPart"
    BatchList:
      type: object
      required: [batches, next_before]
      properties:
        batches:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
        next_before:
          type: [string, "null"]
          description: The "before" of the next page; null on the last page.
    Certificate:
      type: object
      required: [id, status, verify_url, recipient_name, title, achievement, issuer_name, date, issued_at, revoked_at, issued_by, disclaimer]
      properties:
        id:
          type: string
          example: crt_8w3k5q0m2r7t9v4x6z1b
        status:
          type: string
          enum: [valid, revoked]
        verify_url:
          type: string
          format: uri
        recipient_name:
          type: [string, "null"]
          description: As the issuer entered it in the row.
        title:
          type: [string, "null"]
        achievement:
          type: [string, "null"]
        issuer_name:
          type: [string, "null"]
          description: As the issuer entered it; not checked by anyone.
        date:
          type: [string, "null"]
          description: The row's "date", as written on the document.
        issued_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        issued_by:
          type: object
          required: [kind, email_domain, statement]
          properties:
            kind:
              type: string
              description: domain (an organisation's own email domain), personal (a public email provider) or unknown.
              enum: [domain, personal, unknown]
            email_domain:
              type: [string, "null"]
              description: The domain of the issuing account's sign-in email, in ASCII (punycode) form; null unless kind is domain.
            statement:
              type: string
        disclaimer:
          type: string
          description: Link To Card confirms that this record was created by that account. It does not verify the issuer's identity, accreditation or the facts stated.
    # /feature:batch
    # feature:toolkit
    ToolkitFile:
      type: object
      description: 'Exactly one of url (a public http or https address, fetched like card images), base64 (a data: prefix is allowed) or pdf_id (the id of a PDF stored on your account).'
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        base64:
          type: string
        pdf_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
      oneOf:
        - required: [url]
        - required: [base64]
        - required: [pdf_id]
    ToolkitImageFile:
      type: object
      description: A PNG or JPEG image, at most 10 MB (a PNG at most 4 megapixels). Exactly one of url and base64.
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        base64:
          type: string
      oneOf:
        - required: [url]
        - required: [base64]
    MergeFile:
      type: object
      description: A file as in ToolkitFile, with the pages to take from it (default every page, in order).
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        base64:
          type: string
        pdf_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pages:
          $ref: "#/components/schemas/PageRanges"
      oneOf:
        - required: [url]
        - required: [base64]
        - required: [pdf_id]
    PageRanges:
      type: string
      description: 'Pages from 1: "5", "1-3", "8-" (to the last page), comma separated, or "all". A page the document does not have is an error.'
      example: "1-3,5,8-"
    ToolkitResponse:
      type: string
      description: url (default) answers JSON with the stored result; binary answers the PDF.
      enum: [url, binary]
      default: url
    ToolkitFilename:
      type: string
      description: Download name, cleaned like the filename of POST /v1/pdf. Default "<operation>.pdf".
    MergeRequest:
      type: object
      description: 'All files together at most 20 MB and the result at most 500 pages. Unknown fields are refused.'
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/MergeFile"
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
        response:
          $ref: "#/components/schemas/ToolkitResponse"
    SplitRequest:
      type: object
      description: Exactly one of ranges and every. Unknown fields are refused.
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ToolkitFile"
        ranges:
          $ref: "#/components/schemas/PageRanges"
        every:
          type: integer
          minimum: 1
          description: A new file every this many pages.
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
      oneOf:
        - required: [ranges]
        - required: [every]
    StampLayout:
      type: object
      properties:
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.35
        rotation:
          type: number
          description: Degrees, counter-clockwise.
          minimum: -360
          maximum: 360
          default: 0
        position:
          type: string
          enum: [center, top, bottom, left, right, top-left, top-right, bottom-left, bottom-right]
          default: center
        margin:
          type: number
          description: Points (1/72 inch) from the page edges.
          minimum: 0
          default: 36
        pages:
          $ref: "#/components/schemas/PageRanges"
    StampTextRequest:
      type: object
      description: Unknown fields are refused.
      unevaluatedProperties: false
      required: [files, text]
      allOf:
        - $ref: "#/components/schemas/StampLayout"
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ToolkitFile"
        text:
          type: string
          description: One line, at most 2000 characters, Latin characters only (Windows-1252).
          maxLength: 2000
        font:
          type: string
          enum: [helvetica, helvetica-bold, times, times-bold, courier, courier-bold]
          default: helvetica-bold
        font_size:
          type: number
          description: Points.
          exclusiveMinimum: 0
          default: 48
        color:
          type: string
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
          default: "#6b7280"
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
        response:
          $ref: "#/components/schemas/ToolkitResponse"
    StampImageRequest:
      type: object
      description: Unknown fields are refused.
      unevaluatedProperties: false
      required: [files, image]
      allOf:
        - $ref: "#/components/schemas/StampLayout"
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ToolkitFile"
        image:
          $ref: "#/components/schemas/ToolkitImageFile"
        width:
          type: number
          description: Points; the height follows the image. Default the image at one point per pixel, made smaller to fit inside the margins.
          exclusiveMinimum: 0
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
        response:
          $ref: "#/components/schemas/ToolkitResponse"
    FillRequest:
      type: object
      description: Unknown fields are refused.
      additionalProperties: false
      required: [files, values]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ToolkitFile"
        values:
          type: object
          description: |
            Field full names and values: text for text fields (null empties), true or false for
            checkboxes ("true", "false", "yes", "no", "on", "off" too), one option for radio groups
            and dropdowns, a list of options for multi-select fields. Text values at most 2000
            characters and within the field's own maximum length.
          additionalProperties:
            type: [string, boolean, array, "null"]
            items:
              type: string
        flatten:
          type: boolean
          default: false
          description: Turn the form into ordinary page content that can no longer be edited.
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
        response:
          $ref: "#/components/schemas/ToolkitResponse"
    FieldsRequest:
      type: object
      description: Unknown fields are refused.
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ToolkitFile"
    FromImagesRequest:
      type: object
      description: All images together at most 20 MB. Unknown fields are refused.
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ToolkitImageFile"
        page_size:
          type: string
          description: A paper size, or auto (the page is the image, one point per pixel).
          enum: [a4, letter, a5, auto]
          default: a4
        fit:
          type: string
          description: fit shows the whole image inside the margins; fill covers the page and crops the image.
          enum: [fit, fill]
          default: fit
        orientation:
          type: string
          enum: [auto, portrait, landscape]
          default: auto
        margin:
          type: number
          description: Points around a "fit" image.
          minimum: 0
          default: 0
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
        response:
          $ref: "#/components/schemas/ToolkitResponse"
    ProtectRequest:
      type: object
      description: Set user_password, or restrict a permission (which needs owner_password), or both. Unknown fields are refused.
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ToolkitFile"
        user_password:
          type: string
          pattern: "^[\\x20-\\x7e]{1,127}$"
        owner_password:
          type: string
          pattern: "^[\\x20-\\x7e]{1,127}$"
        permissions:
          type: object
          additionalProperties: false
          properties:
            printing:
              type: string
              enum: [high, low, none]
              default: high
            modifying:
              type: boolean
              default: true
            copying:
              type: boolean
              default: true
            annotating:
              type: boolean
              default: true
            filling_forms:
              type: boolean
              default: true
            content_accessibility:
              type: boolean
              default: true
            document_assembly:
              type: boolean
              default: true
        filename:
          $ref: "#/components/schemas/ToolkitFilename"
        response:
          $ref: "#/components/schemas/ToolkitResponse"
    ToolkitMultipart:
      type: object
      description: |
        The same request with the files as uploads: one "files" part per input file, in order, an
        "image" part for a stamp image, and one "options" text part holding the operation's other
        fields as a JSON object (without uploads it may hold "files" as url or pdf_id entries;
        pages per merge file need those). The limits of a JSON body apply. Any other part name is
        refused.
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
        image:
          type: string
          format: binary
        options:
          type: string
          description: 'A JSON object, for example {"ranges": "1-3"}.'
    ToolkitPdf:
      type: object
      description: One result. It counts 1 image for each started block of 10 pages, at least 1.
      required: [op, id, url, pages, bytes, credits_used, filename, created_at, expires_at, usage]
      properties:
        op:
          type: string
          enum: [merge, stamp, fill, from-images, protect]
        id:
          type: string
          description: 64 hexadecimal characters; usable as pdf_id in a later toolkit request while the result is stored.
        url:
          type: string
          format: uri
          description: Public URL of the stored result. Works until expires_at.
        pages:
          type: integer
        bytes:
          type: integer
        credits_used:
          type: integer
        filename:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        usage:
          $ref: "#/components/schemas/Usage"
    ToolkitSplitResult:
      type: object
      required: [op, files, pages, credits_used, created_at, expires_at, usage]
      properties:
        op:
          type: string
          enum: [split]
        files:
          type: array
          maxItems: 20
          items:
            type: object
            required: [range, id, url, pages, bytes, credits_used, filename]
            properties:
              range:
                type: string
                description: The pages of the input this file holds, e.g. "1-4".
              id:
                type: string
              url:
                type: string
                format: uri
              pages:
                type: integer
              bytes:
                type: integer
              credits_used:
                type: integer
              filename:
                type: string
        pages:
          type: integer
        credits_used:
          type: integer
          description: The sum of the files' credits_used.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Every file is stored until then.
        usage:
          $ref: "#/components/schemas/Usage"
    PdfFormField:
      type: object
      required: [name, type, value, required, read_only, pages]
      properties:
        name:
          type: string
          description: The field's full name, as fill takes it.
        type:
          type: string
          enum: [text, checkbox, radio, dropdown, option_list, button, signature, unknown]
        value:
          description: text a string, checkbox a boolean, radio and single dropdown a string or null, multi-select and option list a list.
          type: [string, boolean, array, "null"]
          items:
            type: string
        options:
          type: array
          items:
            type: string
        required:
          type: boolean
        read_only:
          type: boolean
        pages:
          type: array
          description: Pages, from 1, that the field appears on.
          items:
            type: integer
        max_length:
          type: integer
        multiline:
          type: boolean
        multiselect:
          type: boolean
        editable:
          type: boolean
    PdfFormFields:
      type: object
      required: [op, fields, pages, credits_used]
      properties:
        op:
          type: string
          enum: [fields]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/PdfFormField"
        pages:
          type: integer
        credits_used:
          type: integer
          enum: [0]
    # /feature:toolkit
    # feature:linkcards
    CardFromUrlRequest:
      type: object
      description: No html or css; a link card uses a starter template or one of your own. Unknown fields are refused.
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The page, a public https:// URL of at most 2048 characters.
          maxLength: 2048
        template:
          type: string
          description: A starter template id (blog, dark, quote, launch, docs) or the id of one of your own templates (t_...). Default blog.
          default: blog
        data:
          $ref: "#/components/schemas/Data"
        size:
          $ref: "#/components/schemas/Size"
        width:
          type: integer
          description: Instead of "size", together with "height". Must equal one of the sizes.
        height:
          type: integer
        format:
          type: string
          description: jpg is accepted for jpeg.
          enum: [png, jpeg, jpg, webp]
          default: png
        response:
          type: string
          enum: [json, binary]
          default: json
    LinkCard:
      description: The card, as POST /v1/images answers it, plus "link".
      allOf:
        - $ref: "#/components/schemas/Image"
        - type: object
          required: [link]
          properties:
            link:
              type: object
              required: [url, final_url, check_id, check_cached, data]
              properties:
                url:
                  type: string
                  format: uri
                final_url:
                  type: string
                  format: uri
                  description: The page after redirects.
                check_id:
                  type: string
                  description: The page check's id (chk_...).
                check_cached:
                  type: boolean
                  description: true when a stored check was used and no page check was counted.
                data:
                  type: object
                  description: The data the card was made from, the page's values with "data" on top.
                  additionalProperties:
                    type: string
    # /feature:linkcards
    ErrorCode:
      type: string
      description: |
        Stable error code. HTTP status per code:
        invalid_request 400, unsupported_size 400, unsupported_format 400,
        unauthorized 401, invalid_api_key 401, quota_exceeded 402,
        invalid_signature 403, account_suspended 403, plan_required 403, forbidden 403,
        verification_required 403, not_found 404, conflict 409, gone 410,
        payload_too_large 413, unsupported_media_type 415, template_error 422,
        image_fetch_failed 422, page_fetch_failed 422, rate_limited 429,
        render_failed 500, internal_error 500, not_configured 503, render_timeout 504.
        unauthorized is returned only by the dashboard's own endpoints, verification_required
        only by the free tools on the website, and gone is reserved.
      enum:
        - invalid_request
        - unsupported_size
        - unsupported_format
        - unauthorized
        - invalid_api_key
        - quota_exceeded
        - invalid_signature
        - account_suspended
        - plan_required
        - forbidden
        - verification_required
        - not_found
        - conflict
        - gone
        - payload_too_large
        - unsupported_media_type
        - template_error
        - image_fetch_failed
        - page_fetch_failed
        - rate_limited
        - render_failed
        - internal_error
        - not_configured
        - render_timeout
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, docs]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Written for a developer; says what to change. The wording may change.
            docs:
              type: string
              format: uri
              example: https://linktocard.com/docs/api#errors
            details:
              type: object
              description: Present for some errors, for example reason, usage, unknown_fields, limit.
              additionalProperties: true
    # feature:charts
    ChartRequest:
      type: object
      required: [type, labels, series]
      additionalProperties: false
      description: |
        The chart JSON (https://linktocard.com/docs/charts#the-chart-json). Unknown fields are refused
        at every level. Text is one line; colours are "#rgb" or "#rrggbb"; no field is read as an
        address. The "c" parameter of a signed chart URL is the same object without "format".
      properties:
        type:
          type: string
          enum: [bar, line, area, pie, doughnut]
        title:
          type: string
        subtitle:
          type: string
        labels:
          type: array
          minItems: 1
          maxItems: 200
          description: One per bar, point or slice, in order. At most 24 for pie and doughnut.
          items:
            oneOf:
              - type: string
              - type: number
        series:
          type: array
          minItems: 1
          maxItems: 12
          description: Exactly one for pie and doughnut.
          items:
            $ref: "#/components/schemas/ChartSeries"
        options:
          $ref: "#/components/schemas/ChartOptions"
        width:
          type: integer
          minimum: 200
          maximum: 1200
          default: 600
        height:
          type: integer
          minimum: 200
          maximum: 1200
          default: 400
        scale:
          type: integer
          enum: [1, 2]
          default: 1
          description: The image is width x scale by height x scale pixels.
        format:
          type: string
          enum: [png, jpeg, jpg, webp]
          default: png
          description: POST /v1/charts only; a signed chart URL takes the format from its extension.
    ChartSeries:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Defaults to "Series 1", "Series 2", ...
        data:
          type: array
          description: One number per label. Pie and doughnut charts refuse negative numbers.
          items:
            type: number
        color:
          type: string
          pattern: "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
    ChartOptions:
      type: object
      additionalProperties: false
      properties:
        horizontal:
          type: boolean
          default: false
          description: Bar charts only; other types ignore it.
        stacked:
          type: boolean
          default: false
          description: Bar and area charts only; other types ignore it.
        legend:
          type: boolean
          description: Defaults to true for pie, doughnut and charts with more than one series, else false.
        values:
          type: boolean
          default: false
        x_title:
          type: string
        y_title:
          type: string
        prefix:
          type: string
        suffix:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 4
        min:
          type: number
        max:
          type: number
        theme:
          type: string
          enum: [light, dark]
          default: light
        background:
          type: string
          description: '"#rgb", "#rrggbb", or "transparent" (PNG only).'
    ChartImage:
      type: object
      required: [id, url, width, height, format, bytes, cached, credits_used, created_at, expires_at, warnings, usage]
      properties:
        id:
          type: string
          description: 64 hexadecimal characters. The same chart on the same account always has the same id.
        url:
          type: string
          format: uri
          description: Public URL of the image. Works until expires_at.
        width:
          type: integer
          description: Pixels, the chart's width times scale.
        height:
          type: integer
          description: Pixels, the chart's height times scale.
        format:
          $ref: "#/components/schemas/Format"
        bytes:
          type: integer
        cached:
          type: boolean
          description: false when this request drew the chart, true when it was already stored.
        credits_used:
          type: integer
          enum: [0, 1]
          description: 1 for the request that counted the chart, 0 otherwise.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        warnings:
          type: array
          description: Things that could not be drawn as given, such as text no font covers.
          items:
            type: string
        usage:
          $ref: "#/components/schemas/Usage"
    # /feature:charts
  responses:
    ImageFile:
      description: The image.
      headers:
        Cache-Control:
          description: public, max-age=86400, or fewer seconds when the stored image expires sooner.
          schema:
            type: string
        ETag:
          $ref: "#/components/headers/ETag"
        X-LTC-Cache:
          $ref: "#/components/headers/X-LTC-Cache"
        Cross-Origin-Resource-Policy:
          description: cross-origin, so any site may embed the image.
          schema:
            type: string
            enum: [cross-origin]
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    BadRequest:
      description: |
        invalid_request, unsupported_size or unsupported_format. invalid_request with
        details.reason size_not_supported (and details.template, details.size,
        details.supported_sizes) means a starter template was asked for a size it does not
        take: the five starter templates take og, square and portrait, not email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: 'Unknown field "tempalte". Allowed fields: template, html, css, data, size, width, height, format, response.'
              docs: https://linktocard.com/docs/api#errors
              details:
                unknown_fields: [tempalte]
    InvalidApiKey:
      description: invalid_api_key. The Authorization header is missing, or the key is wrong or revoked.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QuotaExceeded:
      description: quota_exceeded. The allowance is used up and the card is not cached. details.usage is the Usage object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountSuspended:
      description: account_suspended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: not_found. Unknown path, site, template or image, or an image whose cache period has ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: payload_too_large. The body is over 96 KB, or the template HTML or CSS is over 32 KB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: template_error or image_fetch_failed. Nothing is stored or counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PageFetchFailed:
      description: page_fetch_failed. The page could not be read. details.reason is dns_failed, connect_failed, timeout, too_many_redirects, insecure_redirect, bad_redirect, http_error (details.status is the site's status) or not_html.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: rate_limited.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: render_failed or internal_error. Nothing is counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RenderTimeout:
      description: render_timeout. The render took longer than 10 seconds. Nothing is counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # feature:pdf
    PdfFile:
      description: The PDF.
      headers:
        Content-Disposition:
          description: inline; filename="<the file name it was rendered with>".
          schema:
            type: string
        Cache-Control:
          description: public, max-age=86400, or fewer seconds when the stored PDF expires sooner.
          schema:
            type: string
        ETag:
          description: The PDF id in double quotes.
          schema:
            type: string
        X-LTC-Cache:
          description: miss when this request rendered (and counted) the PDF, hit when it was served from storage.
          schema:
            type: string
            enum: [hit, miss]
        X-LTC-Pages:
          description: Pages in the PDF.
          schema:
            type: integer
        Cross-Origin-Resource-Policy:
          description: cross-origin, so any site may link or embed the PDF.
          schema:
            type: string
            enum: [cross-origin]
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    PdfQuotaExceeded:
      description: |
        quota_exceeded. Not enough is left in one place for this PDF: it is charged as one block,
        from the monthly allowance or from one top-up, and is never split. Checked before rendering
        (a PDF needs at least 2 images) and again with its real page count. details.usage is the
        Usage object, details.units_needed the images the PDF needs. Nothing is charged. A 402
        after rendering counts toward the daily cap on failed renders and is remembered for 10
        minutes: the identical request is checked against what is left then, without rendering.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfPayloadTooLarge:
      description: payload_too_large. The request body is over 1.5 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfUnprocessable:
      description: |
        template_error (the template cannot be used as written: more than 50 pages, HTML over 1 MB,
        CSS over 256 KB, images over 10 MB together, a PDF over 20 MB (details.max_bytes), @import,
        an external @font-face, a document the browser could not render, ...) or
        image_fetch_failed (a remote image could not be downloaded). Nothing is stored or charged.
        When the browser was reached (more than 50 pages, a PDF over 20 MB, a document it could
        not render), it counts toward the daily cap on failed renders, and the identical request
        gets the same answer for 10 minutes without being rendered again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfNotConfigured:
      description: 'not_configured. PDF rendering is not enabled on this deployment ("PDF rendering is not enabled yet.").'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfRenderTimeout:
      description: render_timeout. Loading or printing the document took longer than 30 seconds. Nothing is charged; it counts toward the daily cap on failed renders, and the identical request gets the same answer for 10 minutes without being rendered again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfRateLimited:
      description: |
        rate_limited. Nothing is charged. One of: a rate limit; the daily cap on failed renders
        (20 per UTC day on Free, 200 on Starter and Pro, per account for POST /v1/pdf and per
        site for signed links; Retry-After is the time until 00:00 UTC, details { limit, scope:
        account, site or sites, period_seconds, retry_after_seconds }; sites: 40 and 400 for the
        signed links of all of an account's sites together); renders still running that hold the last places
        under such a cap (Retry-After of a few seconds, details { limit, scope, running,
        retry_after_seconds }); the brake on the Free plan and
        the free tools while they used far more browser time than usual in the last 24 hours
        (Retry-After 3600; it lifts as that use ages out of the 24-hour window); an identical
        request still making this PDF after 90 seconds (Retry-After until its place can be
        taken over); or the renderer busy for a moment.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PdfServerError:
      description: |
        render_failed or internal_error. Nothing is charged. render_failed: the renderer failed,
        could not be reached or did not finish sending the PDF; these failures of Browser Run do
        not count toward the daily cap on failed renders and are not remembered. It is also the
        answer for a PDF whose page count cannot be read, which does count.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # /feature:pdf
    # feature:batch
    BatchQuotaExceeded:
      description: quota_exceeded. The monthly allowance and top-ups together do not have 2 images for every row. Nothing was started. details.usage is the Usage object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchForbidden:
      description: account_suspended, or plan_required (details rows, max_rows and plan) when the batch has more rows than the plan takes and a higher plan takes that many.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchTemplateNotFound:
      description: not_found. The template does not exist on this account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchZipNotFound:
      description: not_found. No batch with this id on your account, or no such part (details.parts says how many there are; 0 while no document is stored).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchConflict:
      description: conflict. The account already has 2 batches queued or running.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchPayloadTooLarge:
      description: payload_too_large. The request body is over 4 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BatchNotConfigured:
      description: 'not_configured. Bulk documents are not enabled on this deployment ("Bulk documents are not enabled yet."), or PDF rendering is off ("PDF rendering is not enabled yet.").'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CertificatePage:
      description: The verification page.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        X-Robots-Tag:
          schema:
            type: string
            enum: [noindex]
        Content-Security-Policy:
          description: No script, no form, no frame; styles, images and fonts from the same origin only.
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
    # /feature:batch
    # feature:toolkit
    ToolkitResult:
      description: JSON by default; the PDF itself when the request has "response" "binary".
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Content-Disposition:
          description: Binary responses only. inline; filename="<the cleaned file name>".
          schema:
            type: string
        X-LTC-Pages:
          description: Binary responses only. Pages in the result.
          schema:
            type: integer
        X-LTC-Credits-Used:
          description: Binary responses only. Images this request counted.
          schema:
            type: integer
        X-LTC-Pdf-Url:
          description: Binary responses only. The public URL of the stored result.
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ToolkitPdf"
        application/pdf:
          schema:
            type: string
            format: binary
    ToolkitNotFound:
      description: not_found. A pdf_id is not one of your stored PDFs, or its storage time has ended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ToolkitPayloadTooLarge:
      description: |
        payload_too_large. The body is over 28 MB, the files together over 20 MB, an image over
        10 MB, a PNG over 4 megapixels, a file or the result over 500 pages, or a file too complex
        to open (details.reason too_complex). details names the limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ToolkitUnsupportedMediaType:
      description: unsupported_media_type. A file is not a PDF (details.reason not_pdf), or an image is not a PNG or JPEG (not_image).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ToolkitFetchFailed:
      description: image_fetch_failed. A url file could not be downloaded. details.url and details.reason say which and why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ToolkitNotConfigured:
      description: 'not_configured. The PDF toolkit is not enabled on this deployment ("The PDF toolkit is not enabled yet.").'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # /feature:toolkit
    # feature:linkcards
    LinkImageFile:
      description: The card.
      headers:
        Cache-Control:
          description: public, with a max-age that ends when the card is due for a refresh or leaves storage, whichever is first.
          schema:
            type: string
        ETag:
          $ref: "#/components/headers/ETag"
        X-LTC-Cache:
          description: miss when this request made (and counted) the card, hit when it was served from storage, stale when the page could not be read at a refresh and the last card was served.
          schema:
            type: string
            enum: [hit, miss, stale]
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    LinkForbidden:
      description: forbidden (the page, or an address it redirects to, is not on the public internet) or account_suspended.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LinkUnprocessable:
      description: page_fetch_failed (the page could not be read; details.reason as for GET /v1/inspect), template_error or image_fetch_failed. Nothing is counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LinkCardsNotConfigured:
      description: 'not_configured. Cards from links are not enabled on this deployment ("Cards from links are not enabled yet.").'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # /feature:linkcards
    # feature:charts
    ChartsNotConfigured:
      description: 'not_configured. Chart images are not enabled on this deployment ("Chart images are not enabled yet.").'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # /feature:charts
