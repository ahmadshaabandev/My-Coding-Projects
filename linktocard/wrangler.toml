APP_URL = "https://linktocard-staging.<your-subdomain>.workers.dev"
SUPPORT_EMAIL = "support@linktocard.com"
MAIL_FROM = "Link To Card <login@linktocard.com>"
PADDLE_ENV = "sandbox"
# TODO(Ahmad): paste from the Paddle SANDBOX dashboard (see scripts/seed-paddle-sandbox.md).
PADDLE_CLIENT_TOKEN = ""
PADDLE_PRICE_STARTER = ""
PADDLE_PRICE_PRO = ""
PADDLE_PRICE_TOPUP = ""

[[env.staging.d1_databases]]
