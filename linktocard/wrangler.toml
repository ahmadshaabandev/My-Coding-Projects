# Link To Card - one Worker serves the static site (Workers Static Assets) and the API.
#
#   top level        local development (wrangler dev) and the test suite
#   [env.staging]    https://linktocard-staging.<your-subdomain>.workers.dev  (Paddle sandbox)
#   [env.production] https://linktocard.com                                   (Paddle live)
#
# Bindings and [vars] are NOT inherited by environments - every environment repeats them.
# Secrets are never in this file: see README.md "Secrets" (wrangler secret put ... --env <env>).

name = "linktocard"
main = "src/index.ts"
compatibility_date = "2026-11-19"

# Hard per-request CPU ceiling (enforced on Cloudflare's network only). A normal render
# uses 100-400 ms; this stops a pathological template from burning CPU time.
[limits]
cpu_ms = 10000

# Daily housekeeping (src/lib/cleanup.ts): expired sessions, sign-in tokens, cached images.
[triggers]
crons = ["17 3 * * *"]

# Static site. Requests that do not match run_worker_first are served straight from
# assets, never invoke the Worker, and are not billed.
[assets]
directory = "./site/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"   # /terms -> site/dist/terms.html, HTTP 200, no redirect
not_found_handling = "404-page"
run_worker_first = ["/v1/*", "/api/*", "/auth/*", "/webhooks/*", "/i/*", "/playground/*", "/v/*", "/healthz"]

# .wasm is imported as a precompiled WebAssembly.Module (workerd forbids compiling
# WebAssembly from bytes at runtime); fonts are imported as ArrayBuffer.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff", "**/*.woff2", "**/*.ttf", "**/*.otf"]
fallthrough = true

# ---------------------------------------------------------------- local development
[vars]
ENVIRONMENT = "development"
CHECKOUT_ENABLED = "true"
APP_URL = "http://localhost:8787"
SUPPORT_EMAIL = "support@linktocard.com"
MAIL_FROM = "Link To Card <login@linktocard.com>"
PADDLE_ENV = "sandbox"
PADDLE_CLIENT_TOKEN = ""
PADDLE_PRICE_STARTER = ""
PADDLE_PRICE_PRO = ""
PADDLE_PRICE_TOPUP = ""
# PDF documents: on, but without a BROWSER binding here the PDF routes answer 503 not_configured
# (tests inject a mock binding). Browser Run is bound for staging and production only.
PDF_ENABLED = "true"
# Build v3 kill switches (src/lib/features.ts): "true" turns each tool on. Off in production.
EMAIL_FIELDS_ENABLED = "true"
BATCH_ENABLED = "true"
PDF_TOOLKIT_ENABLED = "true"
LINK_CARDS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "linktocard-dev"
database_id = "00000000-0000-0000-0000-000000000000"   # local only, never deployed
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "linktocard-dev"

# Rate limiters. Keep limit/period in sync with RATE_LIMITS in src/config.ts
# (tests/node/forbidden-deps.test.ts fails if they drift). period must be 10 or 60.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_KEY"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_PLAYGROUND"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_PREVIEW"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_PDF_KEY"
namespace_id = "1006"
simple = { limit = 20, period = 10 }

[[ratelimits]]
name = "RL_PDF_FREE"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_TOOLS_PDF"
namespace_id = "1008"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RL_PDF_TOOLS"
namespace_id = "1009"
simple = { limit = 30, period = 60 }

# Bulk documents (POST /v1/batches): this Worker produces and consumes its own queue. The
# consumer numbers are BATCH in src/config.ts (tests/node/wrangler-v3.test.ts compares them).
# Each environment's queue must exist before its first deploy: npx wrangler queues create <name>.
[[queues.producers]]
binding = "BATCH_QUEUE"
queue = "linktocard-batch-dev"

[[queues.consumers]]
queue = "linktocard-batch-dev"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 5
max_concurrency = 5
retry_delay = 30

