# Publishes n8n-nodes-linktocard to npm, with an npm provenance statement, on every version tag.
# Based on n8n-nodes-starter's publish.yml
# (https://github.com/n8n-io/n8n-nodes-starter/blob/master/.github/workflows/publish.yml).
#
# n8n requires every community node to be published from a GitHub action with a provenance
# statement from May 1st 2026 (docs.n8n.io, verification guidelines). Provenance is only generated
# from a public repository whose URL matches package.json "repository" (docs.npmjs.com,
# generating provenance statements).
#
# GitHub only runs workflows from .github/workflows at the root of a repository, so this file
# does nothing inside the Link To Card monorepo. See README.md, "Publishing and verification".
#
# npm authentication, one of:
#   A. npm trusted publishing (no secret). Configure it on npmjs.com for this repository and
#      the workflow file name publish.yml, and allow "npm publish": `npm run release` runs
#      npm publish, and configurations created after Sep 03, 2026 only allow "npm stage publish"
#      unless you choose otherwise (docs.npmjs.com, trusted publishers).
#   B. A granular npm access token with read and write access to this package, stored as the
#      repository secret NPM_TOKEN.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the provenance attestation and trusted publishing.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # Trusted publishing needs npm CLI 11.5.1 or later (docs.npmjs.com, trusted publishers).
      - name: Update npm
        run: 'npm install -g npm@11'

      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Run tests
        run: 'npm test'

      # `n8n-node release` in GitHub Actions runs lint and build, then npm publish with
      # provenance (@n8n/node-cli 0.58.7, dist/commands/release.js).
      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
