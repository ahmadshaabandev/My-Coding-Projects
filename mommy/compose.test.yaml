# FOR TESTING THE KIT ONLY. Not part of running Mommy: the owner uses compose.yaml alone
# (SELF_HOST.md). This override builds the image without the speech models
# (SKIP_MODELS=1) and mounts them read-only from models/ instead (their directories, or
# symlinks to them, as scripts/download_models.sh leaves them), for a machine whose build
# cannot download them:
#
#   docker compose -f compose.yaml -f compose.test.yaml config      # the merged file
#   docker compose -f compose.yaml -f compose.test.yaml up -d --build
#   docker compose -f compose.yaml -f compose.test.yaml exec mommy python -m mommy.share_link
#   docker compose -f compose.yaml -f compose.test.yaml down --volumes
#
# Behind a TLS-intercepting proxy, point MOMMY_BUILD_CA at its CA bundle (read by pip
# during the build only, as the Dockerfile's build_ca secret; never stored in a layer).
# Compose builds through buildx bake, which refuses to read a file outside this folder
# unless allowed: for a bundle elsewhere, also set BUILDX_BAKE_ENTITLEMENTS_FS=0, e.g.
#   MOMMY_BUILD_CA=/path/to/ca.crt BUILDX_BAKE_ENTITLEMENTS_FS=0 \
#     docker compose -f compose.yaml -f compose.test.yaml build

services:
  mommy:
    build:
      args:
        SKIP_MODELS: "1"
      secrets:
        - build_ca
    volumes:
      - ./models/sherpa-onnx-whisper-turbo:/home/user/app/models/sherpa-onnx-whisper-turbo:ro
      - ./models/vits-piper-ar_JO-kareem-medium:/home/user/app/models/vits-piper-ar_JO-kareem-medium:ro
      - ./models/vits-piper-en_US-lessac-medium:/home/user/app/models/vits-piper-en_US-lessac-medium:ro
      - ./models/vits-piper-fr_FR-siwis-medium:/home/user/app/models/vits-piper-fr_FR-siwis-medium:ro

secrets:
  build_ca:
    file: ${MOMMY_BUILD_CA:-/dev/null}
